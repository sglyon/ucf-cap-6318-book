<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- BACKGROUND                                                    -->
  <!-- ============================================================ -->
  <rect width="960" height="530" rx="12" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">One Architecture, Three Philosophies</text>

  <!-- ============================================================ -->
  <!-- CENTER: Original Transformer                                  -->
  <!-- ============================================================ -->
  <g transform="translate(380, 70)">
    <!-- Container -->
    <rect width="200" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">ORIGINAL TRANSFORMER</text>

    <!-- Encoder block -->
    <rect x="14" y="30" width="75" height="50" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="51.5" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">Encoder</text>
    <text x="51.5" y="66" text-anchor="middle" font-size="9" fill="#3B82F6">Bidirectional</text>

    <!-- Decoder block -->
    <rect x="111" y="30" width="75" height="50" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="148.5" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Decoder</text>
    <text x="148.5" y="66" text-anchor="middle" font-size="9" fill="#D97706">Causal</text>

    <!-- Cross-attention arrow between blocks -->
    <line x1="89" y1="55" x2="111" y2="55" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="108,51 115,55 108,59" fill="#94A3B8"/>
    <text x="100" y="92" text-anchor="middle" font-size="8" fill="#94A3B8">cross-attention</text>
  </g>

  <!-- ============================================================ -->
  <!-- BRANCHING ARROWS                                              -->
  <!-- ============================================================ -->

  <!-- Left arrow (to Encoder-Only) -->
  <path d="M 430,170 C 430,210 160,210 160,265" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Center arrow (to Encoder-Decoder) -->
  <path d="M 480,170 L 480,265" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Right arrow (to Decoder-Only) -->
  <path d="M 530,170 C 530,210 800,210 800,265" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ============================================================ -->
  <!-- LEFT: Encoder-Only                                            -->
  <!-- ============================================================ -->
  <g transform="translate(20, 275)">
    <!-- Card background -->
    <rect width="280" height="225" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header bar -->
    <rect width="280" height="40" rx="12" fill="#3B82F6"/>
    <rect y="28" width="280" height="12" fill="#3B82F6"/>
    <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="white">Encoder-Only</text>

    <!-- Architecture mini-diagram -->
    <rect x="25" y="55" width="60" height="40" rx="5" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="55" y="79" text-anchor="middle" font-size="10" font-weight="600" fill="white">Encoder</text>

    <rect x="95" y="55" width="60" height="40" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="125" y="79" text-anchor="middle" font-size="10" fill="#94A3B8">Decoder</text>
    <line x1="105" y1="57" x2="145" y2="93" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="145" y1="57" x2="105" y2="93" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Bidirectional arrows icon -->
    <g transform="translate(175, 62)">
      <line x1="5" y1="13" x2="75" y2="13" stroke="#3B82F6" stroke-width="2"/>
      <polygon points="2,13 12,8 12,18" fill="#3B82F6"/>
      <polygon points="78,13 68,8 68,18" fill="#3B82F6"/>
      <text x="40" y="6" text-anchor="middle" font-size="8" fill="#3B82F6" font-weight="600">BIDIRECTIONAL</text>
    </g>

    <!-- Models -->
    <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">BERT, RoBERTa, DeBERTa</text>

    <!-- Tagline -->
    <text x="140" y="141" text-anchor="middle" font-size="15" font-style="italic" fill="#2563EB">Understands text</text>

    <!-- Task examples -->
    <text x="140" y="165" text-anchor="middle" font-size="10" fill="#475569">Classification | NER | Extractive QA | Similarity</text>

    <!-- Pretraining objective -->
    <rect x="50" y="182" width="180" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="140" y="199" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Masked Language Modeling</text>
  </g>

  <!-- ============================================================ -->
  <!-- CENTER: Encoder-Decoder                                       -->
  <!-- ============================================================ -->
  <g transform="translate(340, 275)">
    <!-- Card background -->
    <rect width="280" height="225" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header bar -->
    <rect width="280" height="40" rx="12" fill="#10B981"/>
    <rect y="28" width="280" height="12" fill="#10B981"/>
    <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="white">Encoder-Decoder</text>

    <!-- Architecture mini-diagram: both highlighted -->
    <rect x="25" y="55" width="60" height="40" rx="5" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="55" y="79" text-anchor="middle" font-size="10" font-weight="600" fill="white">Encoder</text>

    <rect x="105" y="55" width="60" height="40" rx="5" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <text x="135" y="79" text-anchor="middle" font-size="10" font-weight="600" fill="white">Decoder</text>

    <!-- Cross-attention arrow -->
    <line x1="85" y1="75" x2="105" y2="75" stroke="#10B981" stroke-width="2"/>
    <polygon points="102,71 109,75 102,79" fill="#10B981"/>

    <!-- Seq-to-seq arrow icon -->
    <g transform="translate(185, 62)">
      <line x1="0" y1="13" x2="60" y2="13" stroke="#10B981" stroke-width="2"/>
      <polygon points="57,8 67,13 57,18" fill="#10B981"/>
      <text x="33" y="6" text-anchor="middle" font-size="8" fill="#10B981" font-weight="600">SEQ-TO-SEQ</text>
    </g>

    <!-- Models -->
    <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">T5, BART, mBART</text>

    <!-- Tagline -->
    <text x="140" y="141" text-anchor="middle" font-size="15" font-style="italic" fill="#059669">Transforms text</text>

    <!-- Task examples -->
    <text x="140" y="165" text-anchor="middle" font-size="10" fill="#475569">Translation | Summarization | Generative QA</text>

    <!-- Pretraining objective -->
    <rect x="40" y="182" width="200" height="26" rx="13" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
    <text x="140" y="199" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">Span Corruption / Denoising</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT: Decoder-Only                                           -->
  <!-- ============================================================ -->
  <g transform="translate(660, 275)">
    <!-- Card background -->
    <rect width="280" height="225" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header bar -->
    <rect width="280" height="40" rx="12" fill="#F59E0B"/>
    <rect y="28" width="280" height="12" fill="#F59E0B"/>
    <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="white">Decoder-Only</text>

    <!-- Architecture mini-diagram: grayed encoder, highlighted decoder -->
    <rect x="25" y="55" width="60" height="40" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="55" y="79" text-anchor="middle" font-size="10" fill="#94A3B8">Encoder</text>
    <line x1="35" y1="57" x2="75" y2="93" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="75" y1="57" x2="35" y2="93" stroke="#CBD5E1" stroke-width="1"/>

    <rect x="105" y="55" width="60" height="40" rx="5" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <text x="135" y="79" text-anchor="middle" font-size="10" font-weight="600" fill="white">Decoder</text>

    <!-- Left-to-right arrow icon -->
    <g transform="translate(185, 62)">
      <line x1="0" y1="13" x2="60" y2="13" stroke="#F59E0B" stroke-width="2"/>
      <polygon points="57,8 67,13 57,18" fill="#F59E0B"/>
      <text x="33" y="6" text-anchor="middle" font-size="8" fill="#D97706" font-weight="600">LEFT-TO-RIGHT</text>
    </g>

    <!-- Models -->
    <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">GPT, LLaMA, Claude</text>

    <!-- Tagline -->
    <text x="140" y="141" text-anchor="middle" font-size="15" font-style="italic" fill="#D97706">Generates text</text>

    <!-- Task examples -->
    <text x="140" y="165" text-anchor="middle" font-size="10" fill="#475569">Completions | Conversations | Creative Writing</text>

    <!-- Pretraining objective -->
    <rect x="40" y="182" width="200" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="140" y="199" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Causal Language Modeling</text>
  </g>
</svg>