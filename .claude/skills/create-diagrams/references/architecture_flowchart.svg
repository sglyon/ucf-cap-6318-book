<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- BACKGROUND                                                    -->
  <!-- ============================================================ -->
  <rect width="700" height="440" rx="12" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Architecture Decision Flowchart</text>

  <!-- ============================================================ -->
  <!-- START NODE (rounded rect, neutral gray)                       -->
  <!-- ============================================================ -->
  <rect x="248" y="52" width="204" height="42" rx="21" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">What is your NLP task?</text>

  <!-- Arrow: Start → Decision 1 -->
  <line x1="350" y1="94" x2="350" y2="122" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- DECISION 1: Diamond – "Does the task require generating       -->
  <!--              new text?"                                       -->
  <!-- ============================================================ -->
  <g transform="translate(350, 172)">
    <polygon points="0,-48 120,0 0,48 -120,0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Does the task require</text>
    <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">generating new text?</text>
  </g>

  <!-- ============================================================ -->
  <!-- "No" branch: Decision 1 → Encoder-Only (LEFT)                -->
  <!-- ============================================================ -->
  <!-- Arrow going left from diamond -->
  <line x1="230" y1="172" x2="150" y2="172" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- "No" label -->
  <rect x="175" y="155" width="32" height="18" rx="4" fill="#DBEAFE"/>
  <text x="191" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">No</text>

  <!-- Encoder-Only terminal box (BLUE) -->
  <g transform="translate(16, 138)">
    <rect width="125" height="68" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <!-- Header band -->
    <rect width="125" height="28" rx="10" fill="#3B82F6"/>
    <rect y="18" width="125" height="10" fill="#3B82F6"/>
    <text x="62.5" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="white">Encoder-Only</text>
    <!-- Example tasks -->
    <text x="62.5" y="44" text-anchor="middle" font-size="8.5" fill="#475569">Classification, NER,</text>
    <text x="62.5" y="56" text-anchor="middle" font-size="8.5" fill="#475569">Extractive QA, Similarity</text>
  </g>

  <!-- ============================================================ -->
  <!-- "Yes" branch: Decision 1 → Decision 2 (DOWN)                 -->
  <!-- ============================================================ -->
  <!-- Arrow going down from diamond -->
  <line x1="350" y1="220" x2="350" y2="270" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- "Yes" label -->
  <rect x="356" y="232" width="34" height="18" rx="4" fill="#FEF3C7"/>
  <text x="373" y="245" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Yes</text>

  <!-- ============================================================ -->
  <!-- DECISION 2: Diamond – "Is the output a transformation         -->
  <!--              of specific input?"                              -->
  <!-- ============================================================ -->
  <g transform="translate(350, 322)">
    <polygon points="0,-48 130,0 0,48 -130,0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Is the output a transformation</text>
    <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">of specific input?</text>
  </g>

  <!-- ============================================================ -->
  <!-- "Yes" branch: Decision 2 → Encoder-Decoder (LEFT)             -->
  <!-- ============================================================ -->
  <!-- Arrow going left from diamond -->
  <line x1="220" y1="322" x2="150" y2="322" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- "Yes" label -->
  <rect x="170" y="305" width="34" height="18" rx="4" fill="#D1FAE5"/>
  <text x="187" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">Yes</text>

  <!-- Encoder-Decoder terminal box (GREEN) -->
  <g transform="translate(16, 288)">
    <rect width="125" height="68" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <!-- Header band -->
    <rect width="125" height="28" rx="10" fill="#10B981"/>
    <rect y="18" width="125" height="10" fill="#10B981"/>
    <text x="62.5" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="white">Encoder-Decoder</text>
    <!-- Example tasks -->
    <text x="62.5" y="44" text-anchor="middle" font-size="8.5" fill="#475569">Translation,</text>
    <text x="62.5" y="56" text-anchor="middle" font-size="8.5" fill="#475569">Summarization</text>
  </g>

  <!-- ============================================================ -->
  <!-- "No" branch: Decision 2 → Decoder-Only (RIGHT)               -->
  <!-- ============================================================ -->
  <!-- Arrow going right from diamond -->
  <line x1="480" y1="322" x2="550" y2="322" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <!-- "No" label -->
  <rect x="497" y="305" width="32" height="18" rx="4" fill="#FEF3C7"/>
  <text x="513" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">No</text>

  <!-- Decoder-Only terminal box (ORANGE) -->
  <g transform="translate(559, 282)">
    <rect width="125" height="80" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <!-- Header band -->
    <rect width="125" height="28" rx="10" fill="#F59E0B"/>
    <rect y="18" width="125" height="10" fill="#F59E0B"/>
    <text x="62.5" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="white">Decoder-Only</text>
    <!-- Example tasks -->
    <text x="62.5" y="44" text-anchor="middle" font-size="8.5" fill="#475569">Chatbot, Open-ended</text>
    <text x="62.5" y="56" text-anchor="middle" font-size="8.5" fill="#475569">generation,</text>
    <text x="62.5" y="68" text-anchor="middle" font-size="8.5" fill="#475569">Creative writing</text>
  </g>

  <!-- ============================================================ -->
  <!-- FOOTNOTE                                                      -->
  <!-- ============================================================ -->
  <text x="350" y="420" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">At sufficient scale, decoder-only models can handle most tasks via prompting — but specialized architectures are more efficient.</text>
</svg>