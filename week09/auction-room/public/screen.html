<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projector · Classroom Auctions</title><link rel="stylesheet" href="/style.css"><script defer src="/common.js"></script><script defer src="/qrcode.js"></script></head>
<body class="screen"><main><header><h1>Classroom Auctions</h1><span id="connection" role="status">Connecting…</span></header><div class="grid">
<section class="panel"><div class="split"><span id="roundStatus"></span><span id="participants"></span></div><p id="format" class="tag"></p><h2 id="item">Welcome, bidders</h2><div id="price" class="price"></div><p id="detail" class="rules"></p><div id="clock" class="timer number"></div><p id="rules" class="rules"></p></section>
<aside><section class="panel"><h2>Join on your phone</h2><div id="qr"></div><p id="joinUrl"></p><p id="budget"></p><p class="muted">Fake credits. Real items. Your balance carries over.</p></section><section><h2>In the room</h2><p id="roster"></p><h2>Completed auctions</h2><ul id="history" class="list"></ul></section></aside></div></main>
<script>addEventListener('DOMContentLoaded',()=>{let lastUrl;connect(s=>{common(s);$('budget').textContent=`Starting budget: ${s.initialBudget} credits`;$('roster').textContent=s.players.map(p=>p.name).join(' · ')||'Waiting for bidders…';const url=(s.publicUrl||location.origin)+'/';$('joinUrl').textContent=url;if(lastUrl!==url){lastUrl=url;try{const qr=qrcode(0,'M');qr.addData(url);qr.make();$('qr').innerHTML=`<img alt="Scan to join the auction" src="${qr.createDataURL(8,24)}">`;}catch{$('qr').textContent='Use the join URL below.';}}});});</script></body></html>
