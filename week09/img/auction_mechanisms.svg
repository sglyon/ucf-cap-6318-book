<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="980" height="620" rx="12" fill="#FFFFFF"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Four Auction Mechanisms</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#64748B">Illustrative bids show the payment rules, not equilibrium strategies</text>

  <!-- ============================================================ -->
  <!-- PANEL 1: Ascending (English)                                  -->
  <!-- ============================================================ -->
  <g transform="translate(20, 75)">
    <rect width="460" height="250" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect width="460" height="38" rx="14" fill="#F59E0B"/>
    <rect y="26" width="460" height="12" fill="#F59E0B"/>
    <text x="230" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1. Ascending (English)</text>
    <text x="230" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Price rises; bidders drop out one at a time</text>

    <!-- Bidder A: active to stop point, then dashed to true value -->
    <line x1="70" y1="78" x2="220" y2="78" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="78" x2="280" y2="78" stroke="#92400E" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="70" cy="78" r="10" fill="#FFFFFF" stroke="#92400E" stroke-width="1.5"/>
    <text x="70" y="82" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">A</text>
    <polygon points="220,70 226,78 220,86 214,78" fill="#D97706"/>
    <text x="220" y="64" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">auction ends</text>
    <text x="250" y="94" text-anchor="middle" font-size="8" font-style="italic" fill="#92400E">A remains willing (unused)</text>

    <!-- Bidder B: drops at 220 -->
    <line x1="70" y1="106" x2="220" y2="106" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="106" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="70" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">B</text>
    <line x1="215" y1="101" x2="225" y2="111" stroke="#EF4444" stroke-width="2"/>
    <line x1="225" y1="101" x2="215" y2="111" stroke="#EF4444" stroke-width="2"/>

    <!-- Bidder C: drops at 160 -->
    <line x1="70" y1="134" x2="160" y2="134" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="134" r="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="70" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">C</text>
    <line x1="155" y1="129" x2="165" y2="139" stroke="#EF4444" stroke-width="2"/>
    <line x1="165" y1="129" x2="155" y2="139" stroke="#EF4444" stroke-width="2"/>

    <!-- guides down to axis -->
    <line x1="220" y1="90" x2="220" y2="165" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="160" y1="139" x2="160" y2="165" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- axis -->
    <line x1="70" y1="165" x2="430" y2="165" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="428" y="179" text-anchor="end" font-size="9" fill="#64748B">price &#8594;</text>
    <text x="160" y="179" text-anchor="middle" font-size="9" fill="#475569">$30</text>
    <text x="220" y="179" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">$50</text>

    <rect x="40" y="198" width="380" height="27" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="230" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">A wins, pays $50 (price when B, the last rival, drops)</text>
    <text x="230" y="240" text-anchor="middle" font-size="9" font-style="italic" fill="#64748B">bid = willingness to stay in at the called price</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 2: Descending (Dutch)                                   -->
  <!-- ============================================================ -->
  <g transform="translate(500, 75)">
    <rect width="460" height="250" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect width="460" height="38" rx="14" fill="#F59E0B"/>
    <rect y="26" width="460" height="12" fill="#F59E0B"/>
    <text x="230" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2. Descending (Dutch)</text>
    <text x="230" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Price falls; first bidder to accept wins</text>

    <!-- falling price ticks -->
    <text x="100" y="78" text-anchor="middle" font-size="9" fill="#94A3B8">$100</text>
    <text x="190" y="78" text-anchor="middle" font-size="9" fill="#94A3B8">$80</text>
    <text x="280" y="78" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">$55</text>
    <text x="370" y="78" text-anchor="middle" font-size="9" fill="#CBD5E1">$35</text>

    <!-- silent bidder A (before stop) -->
    <circle cx="190" cy="104" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="190" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#94A3B8">A</text>
    <text x="190" y="128" text-anchor="middle" font-size="8" fill="#94A3B8">waiting&#8230;</text>

    <!-- B accepts at stop point -->
    <line x1="280" y1="98" x2="280" y2="140" stroke="#92400E" stroke-width="2"/>
    <circle cx="280" cy="90" r="12" fill="#FFFBEB" stroke="#92400E" stroke-width="2"/>
    <text x="280" y="94" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">B</text>
    <text x="280" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">B calls out!</text>

    <!-- C never gets a turn -->
    <circle cx="370" cy="104" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="370" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#CBD5E1">C</text>
    <text x="370" y="128" text-anchor="middle" font-size="8" fill="#CBD5E1">never gets a turn</text>

    <!-- axis -->
    <line x1="70" y1="140" x2="430" y2="140" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="428" y="154" text-anchor="end" font-size="9" fill="#64748B">time &#8594;</text>

    <rect x="40" y="198" width="380" height="27" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="230" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">B wins, pays $55 (the price when they called out)</text>
    <text x="230" y="240" text-anchor="middle" font-size="9" font-style="italic" fill="#64748B">bid = the moment you accept the called price</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 3: Sealed first-price                                   -->
  <!-- ============================================================ -->
  <g transform="translate(20, 340)">
    <rect width="460" height="250" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect width="460" height="38" rx="14" fill="#F59E0B"/>
    <rect y="26" width="460" height="12" fill="#F59E0B"/>
    <text x="230" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3. Sealed-bid, first-price</text>
    <text x="230" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Bids submitted secretly, opened together</text>

    <!-- envelopes for A, B, C -->
    <g>
      <text x="120" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$70</text>
      <rect x="80" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/>
      <path d="M 80 70 L 120 98 L 160 70" fill="none" stroke="#92400E" stroke-width="1.5"/>
      <text x="158" y="76" text-anchor="middle" font-size="13" fill="#D97706">&#9733;</text>
      <text x="120" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">$65</text>
      <text x="120" y="156" text-anchor="middle" font-size="9" fill="#475569">bidder A (winner)</text>
    </g>
    <g>
      <text x="230" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$55</text>
      <rect x="190" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M 190 70 L 230 98 L 270 70" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="230" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">$50</text>
      <text x="230" y="156" text-anchor="middle" font-size="9" fill="#475569">bidder B</text>
    </g>
    <g>
      <text x="340" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$40</text>
      <rect x="300" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M 300 70 L 340 98 L 380 70" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="340" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">$30</text>
      <text x="340" y="156" text-anchor="middle" font-size="9" fill="#475569">bidder C</text>
    </g>

    <rect x="40" y="198" width="380" height="27" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="230" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">A wins (highest bid $65), pays own bid: $65</text>
    <text x="230" y="240" text-anchor="middle" font-size="9" font-style="italic" fill="#64748B">bid ($65) is chosen privately and may sit below value ($70)</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 4: Sealed second-price                                  -->
  <!-- ============================================================ -->
  <g transform="translate(500, 340)">
    <rect width="460" height="250" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect width="460" height="38" rx="14" fill="#F59E0B"/>
    <rect y="26" width="460" height="12" fill="#F59E0B"/>
    <text x="230" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4. Sealed-bid, second-price</text>
    <text x="230" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Bids submitted secretly, opened together</text>

    <g>
      <text x="120" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$70</text>
      <rect x="80" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/>
      <path d="M 80 70 L 120 98 L 160 70" fill="none" stroke="#92400E" stroke-width="1.5"/>
      <text x="158" y="76" text-anchor="middle" font-size="13" fill="#D97706">&#9733;</text>
      <text x="120" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">$65</text>
      <text x="120" y="156" text-anchor="middle" font-size="9" fill="#475569">bidder A (winner)</text>
    </g>
    <g>
      <text x="230" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$55</text>
      <rect x="190" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
      <path d="M 190 70 L 230 98 L 270 70" fill="none" stroke="#D97706" stroke-width="1.5"/>
      <text x="230" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">$50</text>
      <text x="230" y="156" text-anchor="middle" font-size="9" fill="#92400E">bidder B (sets price)</text>
    </g>
    <g>
      <text x="340" y="64" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">value v=$40</text>
      <rect x="300" y="70" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M 300 70 L 340 98 L 380 70" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="340" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">$30</text>
      <text x="340" y="156" text-anchor="middle" font-size="9" fill="#475569">bidder C</text>
    </g>

    <rect x="40" y="198" width="380" height="27" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="230" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">A wins (highest bid $65), pays 2nd-highest bid: $50</text>
    <text x="230" y="240" text-anchor="middle" font-size="9" font-style="italic" fill="#64748B">price = highest competing bid, not the winner's own bid</text>
  </g>
</svg>
