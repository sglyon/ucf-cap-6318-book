[project]
name = "ucf-cap-6318-book"
version = "0.2.0"
description = "CAP-6318 Computational Analysis of Social Complexity (Python edition)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "networkx>=3.5",
    "quantecon>=0.10.1",
    "mesa>=3.3.1",
    "ipywidgets>=8.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-ai>=1.12.0",
    "fastmcp>=2.13.0.2",
]

[dependency-groups]
dev = [
    "mystmd>=1.6.0",
    "ipykernel>=7.1.0",
    "ipython>=9.7.0",
    "jupyter-server>=2.20.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]
