<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="980" height="440" rx="12" fill="#FFFFFF"/>

  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Pipe vs. Platform: Where Does Value Come From?</text>
  <text x="490" y="52" text-anchor="middle" font-size="11" fill="#64748B">Compare a bakery's production chain to a matchmaking platform</text>

  <line x1="490" y1="72" x2="490" y2="410" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANEL: PIPE -->
  <text x="245" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">Pipe: Bakery Production Chain</text>

  <g>
    <rect x="45" y="170" width="85" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="87" y="200" text-anchor="middle" font-size="13" fill="#475569">Flour</text>

    <line x1="130" y1="195" x2="148" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

    <rect x="150" y="170" width="85" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="192" y="200" text-anchor="middle" font-size="13" fill="#475569">Labor</text>

    <line x1="235" y1="195" x2="253" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

    <rect x="255" y="170" width="85" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="297" y="200" text-anchor="middle" font-size="13" fill="#475569">Oven</text>

    <line x1="340" y1="195" x2="358" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

    <rect x="360" y="170" width="85" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="402" y="200" text-anchor="middle" font-size="13" fill="#166534">Bread</text>
  </g>

  <line x1="60" y1="270" x2="425" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="245" y="295" text-anchor="middle" font-size="12" fill="#475569">Value moves in one direction along the chain</text>
  <text x="245" y="415" text-anchor="middle" font-size="11" fill="#64748B">No group's value depends on who else shows up</text>

  <!-- RIGHT PANEL: PLATFORM -->
  <text x="735" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">Platform: Diners Club Matchmaking</text>

  <!-- Diners cluster -->
  <rect x="525" y="140" width="130" height="220" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="590" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">Diners</text>
  <circle cx="590" cy="195" r="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="590" cy="235" r="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="590" cy="275" r="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="590" y="335" text-anchor="middle" font-size="10.5" fill="#1E40AF">join partly because</text>
  <text x="590" y="349" text-anchor="middle" font-size="10.5" fill="#1E40AF">restaurants are here</text>

  <!-- Restaurants cluster -->
  <rect x="840" y="140" width="130" height="220" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="905" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Restaurants</text>
  <circle cx="905" cy="195" r="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="905" cy="235" r="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="905" cy="275" r="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="905" y="335" text-anchor="middle" font-size="10.5" fill="#92400E">join partly because</text>
  <text x="905" y="349" text-anchor="middle" font-size="10.5" fill="#92400E">diners are here</text>

  <!-- Hub -->
  <rect x="685" y="215" width="125" height="70" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="747" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E293B">Platform</text>
  <text x="747" y="261" text-anchor="middle" font-size="10.5" fill="#475569">(Diners Club)</text>

  <!-- forward arrows: diners -> hub -> restaurants -->
  <line x1="655" y1="222" x2="683" y2="222" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="810" y1="222" x2="838" y2="222" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- reverse arrows: restaurants -> hub -> diners -->
  <line x1="838" y1="278" x2="810" y2="278" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="683" y1="278" x2="655" y2="278" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <text x="747" y="308" text-anchor="middle" font-size="11" fill="#475569">value depends on who else</text>
  <text x="747" y="322" text-anchor="middle" font-size="11" fill="#475569">is on the platform</text>
  <text x="735" y="415" text-anchor="middle" font-size="11" fill="#64748B">Each side's value depends on the other side's presence</text>
</svg>
