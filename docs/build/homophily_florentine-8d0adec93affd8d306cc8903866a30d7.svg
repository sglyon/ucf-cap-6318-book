  <text x="540.0" y="35" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">Counting wealth types in the Florentine network</text>
  <text x="540" y="63" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">An edge represents a marriage between families. Count each edge once.</text>
