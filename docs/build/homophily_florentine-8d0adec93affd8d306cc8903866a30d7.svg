<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-labelledby="title description" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Counting wealth types in the Florentine network</title>
  <desc id="description">The 15-family network has 20 marriage edges. Seven families have wealth above 42. Five edges join two high-wealth families, three join two low-wealth families, and twelve cross wealth types. Cross edges are purple dashed lines, high-high edges blue, and low-low edges amber. H and L labels identify node types.</desc>
