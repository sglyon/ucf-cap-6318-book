<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="900" height="450" rx="12" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Worker Flows and the Steady State</text>

  <g transform="translate(24,62)">
    <rect width="370" height="316" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="370" height="38" rx="12" fill="#3B82F6"/>
    <rect y="26" width="370" height="12" fill="#3B82F6"/>
    <text x="185" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Each month, workers can change state</text>

    <circle cx="105" cy="126" r="48" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="265" cy="126" r="48" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Employed</text>
    <text x="105" y="141" text-anchor="middle" font-size="10" fill="#475569">state 1</text>
    <text x="265" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Unemployed</text>
    <text x="265" y="141" text-anchor="middle" font-size="10" fill="#475569">state 2</text>

    <path d="M150,108 C180,82 210,82 222,105" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="185" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">α</text>
    <text x="185" y="91" text-anchor="middle" font-size="9" fill="#475569">becomes unemployed</text>
    <path d="M220,148 C190,173 160,173 148,150" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="185" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">β</text>
    <text x="185" y="198" text-anchor="middle" font-size="9" fill="#475569">is hired</text>

    <path d="M78,84 C48,54 52,154 77,163" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <text x="38" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">1−α</text>
    <path d="M292,84 C322,54 318,154 293,163" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <text x="332" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">1−β</text>

    <rect x="42" y="220" width="286" height="68" rx="9" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="185" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Rows: current state  ·  columns: next state</text>
    <text x="185" y="270" text-anchor="middle" font-size="17" font-weight="600" fill="#1E293B">P<tspan baseline-shift="sub" font-size="11">w</tspan> = [ 1−α   α ;   β   1−β ]</text>
  </g>

  <g transform="translate(418,62)">
    <rect width="458" height="316" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="229" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Population shares evolve by transposing P<tspan baseline-shift="sub" font-size="9">w</tspan></text>
    <rect x="92" y="45" width="274" height="34" rx="17" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="229" y="67" text-anchor="middle" font-size="15" font-weight="700" fill="#1E40AF">x<tspan baseline-shift="sub" font-size="10">t+1</tspan> = P<tspan baseline-shift="super" font-size="10">T</tspan><tspan baseline-shift="sub" font-size="10">w</tspan> x<tspan baseline-shift="sub" font-size="10">t</tspan></text>

    <text x="26" y="113" font-size="11" font-weight="600" fill="#475569">t = 0</text>
    <rect x="86" y="96" width="306" height="24" rx="5" fill="#E2E8F0"/>
    <rect x="86" y="96" width="275" height="24" rx="5" fill="#3B82F6"/>
    <text x="224" y="113" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">90% employed</text>
    <text x="401" y="113" font-size="9" fill="#64748B">10%</text>

    <line x1="239" y1="126" x2="239" y2="144" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="26" y="174" font-size="11" font-weight="600" fill="#475569">t = 1</text>
    <rect x="86" y="157" width="306" height="24" rx="5" fill="#E2E8F0"/>
    <rect x="86" y="157" width="196" height="24" rx="5" fill="#3B82F6"/>
    <text x="184" y="174" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">64% employed</text>
    <text x="337" y="174" text-anchor="middle" font-size="10" fill="#475569">36% unemployed</text>

    <line x1="239" y1="187" x2="239" y2="205" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="20" y="235" font-size="11" font-weight="600" fill="#475569">t → ∞</text>
    <rect x="86" y="218" width="306" height="24" rx="5" fill="#E2E8F0"/>
    <rect x="86" y="218" width="77" height="24" rx="5" fill="#3B82F6"/>
    <text x="124" y="235" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">25%</text>
    <text x="278" y="235" text-anchor="middle" font-size="10" fill="#475569">75% unemployed</text>

    <rect x="46" y="262" width="366" height="36" rx="18" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="229" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">Steady state: P<tspan baseline-shift="super" font-size="8">T</tspan><tspan baseline-shift="sub" font-size="8">w</tspan> x* = x*  —  a dominant left eigenvector</text>
  </g>
  <text x="450" y="420" text-anchor="middle" font-size="10" fill="#64748B">Example shown: α = 0.3, β = 0.1, and x<tspan baseline-shift="sub" font-size="7">0</tspan> = (0.9, 0.1)</text>
</svg>
