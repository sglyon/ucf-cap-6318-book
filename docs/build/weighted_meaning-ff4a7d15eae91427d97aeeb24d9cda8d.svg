<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>What does the weight mean?</title><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs><rect width="850" height="220" rx="12" fill="#FFFFFF"/><text x="425.0" y="32" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">What does the weight mean?</text><rect x="20" y="53" width="395" height="112" rx="12" fill="#EFF6FF" stroke="#E2E8F0"/><text x="38" y="80" font-size="15" fill="#1E40AF" text-anchor="start" font-weight="600">Friendship strength</text><text x="38" y="109" font-size="12" fill="#475569" text-anchor="start" font-weight="400">A—B: +1     A—C: +2</text><text x="38" y="134" font-size="12" fill="#475569" text-anchor="start" font-weight="400">A and C have the stronger positive tie.</text><rect x="435" y="53" width="395" height="112" rx="12" fill="#EFF6FF" stroke="#E2E8F0"/><text x="453" y="80" font-size="15" fill="#1E40AF" text-anchor="start" font-weight="600">Travel cost</text><text x="453" y="109" font-size="12" fill="#475569" text-anchor="start" font-weight="400">A → D → G: 3 + 8 = 11</text><text x="453" y="134" font-size="12" fill="#475569" text-anchor="start" font-weight="400">We minimize the sum of costs along a route.</text><text x="425" y="195" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">The number needs an interpretation before we choose what to calculate.</text></svg>