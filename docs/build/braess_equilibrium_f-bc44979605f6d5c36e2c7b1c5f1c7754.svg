 x2="364.3" y2="180.6" stroke="#3B82F6" stroke-width="3" marker-end="url(#arr-blue)"/><rect x="48.0" y="81.5" width="86" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="91.0" y="95.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">2,000 drivers</text><text x="91.0" y="110.5" font-size="11" fill="#1E40AF" text-anchor="middle" font-weight="700">x/100 = 20 min</text><rect x="286.0" y="81.5" width="86" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="329.0" y="95.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">2,000 drivers</text><text x="329.0" y="110.5" font-size="11" fill="#1E40AF" text-anchor="middle" font-weight="700">45 min</text><rect x="48.0" y="224.5" width="86" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="91.0" y="238.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">2,000 drivers</text><text x="91.0" y="253.5" font-size="11" fill="#1E40AF" text-anchor="middle" font-weight="700">45 min</text><rect x="286.0" y="224.5" width="86" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="329.0" y="238.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">2,000 drivers</text><text x="329.0" y="253.5" font-size="11" fill="#1E40AF" text-anchor="middle" font-weight="700">x/100 = 20 min</text><circle cx="40" cy="170" r="17" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/><text x="40" y="175" font-size="13" fill="#1E40AF" text-anchor="middle" font-weight="700">A</text><circle cx="380" cy="170" r="17" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/><text x="380" y="175" font-size="13" fill="#1E40AF" text-anchor="middle" font-weight="700">B</text><circle cx="210" cy="55" r="17" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/><text x="210" y="60" font-size="13" fill="#1E40AF" text-anchor="middle" font-weight="700">C</text><circle cx="210" cy="285" r="17" fil