<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="title">Two ways to model a tomato market</title><desc id="desc">An illustrative equation-based model uses supply and demand to find a market-clearing price of $3.50 per pound and 500 pounds sold. The individual prices, stocks, and budgets are illustrative, not simulation results. An agent-based model represents individual buyers and vendors with different prices and inventories; purchases change inventory, and vendors can adjust prices.</desc><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#10B981"/></marker></defs><rect width="850" height="450" rx="12" fill="#FFFFFF"/><text x="425.0" y="34" font-size="20" fill="#1E293B" font-weight="700" text-anchor="middle">Two ways to model a tomato market</text><g filter="url(#shadow)"><rect x="20" y="60" width="390" height="330" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="20" y="60" width="390" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="36" y="83" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">Equation-based example</text><g filter="url(#shadow)"><rect x="440" y="60" width="390" height="330" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="440" y="60" width="390" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="456" y="83" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">Agent-based example</text><text x="42" y="118" font-size="12" fill="#475569" font-weight="400" text-anchor="start">How do supply and demand meet?</text><path d="M 80 135 V 302 H 370" fill="none" stroke="#475569" stroke-width="1.5"/><text x="64" y="145" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">$/lb</text><text x="332" y="320" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">lbs sold</text><path d="M 105 285 L 345 145" stroke="#3B82F6" stroke-width="2.5"/><path d="M 105 145 L 345 285" stroke="#F59E0B" stroke-width="2.5"/><text x="333" y="140" font-size="11" fill="#1E40AF" font-weight="400" text-anchor="start">Supply</text><text x="298" y="289" font-size="11" fill="#92400E" font-weight="400" text-anchor="start">Demand</text><path d="M 80 215 H 225 V 302" fill="none" stroke="#94A3B8" stroke-dasharray="4 3"/><circle cx="225" cy="215" r="6" fill="#10B981"/><text x="74" y="218" font-size="10" fill="#475569" font-weight="400" text-anchor="end">3.50</text><text x="225" y="319" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">500</text><text x="40" y="358" font-size="12" fill="#065F46" font-weight="600" text-anchor="start">A market-clearing price and quantity</text><text x="460" y="118" font-size="12" fill="#475569" font-weight="400" text-anchor="start">How do individual transactions unfold?</text><rect x="463" y="142" width="105" height="80" rx="8" fill="#FFFFFF" stroke="#10B981"/><path d="M 463 150 H 568" stroke="#10B981" stroke-width="8"/><text x="515" y="174" font-size="12" fill="#065F46" font-weight="600" text-anchor="middle">$3.00/lb</text><text x="515" y="197" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">40 lbs in stock</text><rect x="580" y="142" width="105" height="80" rx="8" fill="#FFFFFF" stroke="#10B981"/><path d="M 580 150 H 685" stroke="#10B981" stroke-width="8"/><text x="632" y="174" font-size="12" fill="#065F46" font-weight="600" text-anchor="middle">$3.50/lb</text><text x="632" y="197" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">65 lbs in stock</text><rect x="697" y="142" width="105" height="80" rx="8" fill="#FFFFFF" stroke="#10B981"/><path d="M 697 150 H 802" stroke="#10B981" stroke-width="8"/><text x="749" y="174" font-size="12" fill="#065F46" font-weight="600" text-anchor="middle">$4.00/lb</text><text x="749" y="197" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">30 lbs in stock</text><path d="M 494 281 L 515 229" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/><circle cx="494" cy="293" r="10" fill="#DBEAFE" stroke="#3B82F6"/><path d="M 480 322 Q 494 300 508 322" stroke="#3B82F6" fill="none" stroke-width="2"/><text x="494" y="342" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">Budget $8</text><path d="M 633 281 L 632 229" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/><circle cx="633" cy="293" r="10" fill="#DBEAFE" stroke="#3B82F6"/><path d="M 619 322 Q 633 300 647 322" stroke="#3B82F6" fill="none" stroke-width="2"/><text x="633" y="342" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">Budget $12</text><path d="M 772 281 L 749 229" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/><circle cx="772" cy="293" r="10" fill="#DBEAFE" stroke="#3B82F6"/><path d="M 758 322 Q 772 300 786 322" stroke="#3B82F6" fill="none" stroke-width="2"/><text x="772" y="342" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">Budget $15</text><text x="635" y="356" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">Buyers compare price and quality</text><text x="460" y="373" font-size="11" fill="#065F46" font-weight="400" text-anchor="start">Purchases change stock; vendors adjust prices.</text><text x="425" y="421" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">Suppose we want to study end-of-day discounts. What would we need to keep?</text><path d="M 807 216 H 819 V 132 H 791" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow)"/><text x="748" y="135" font-size="9" fill="#065F46" text-anchor="middle">Update prices</text></svg>