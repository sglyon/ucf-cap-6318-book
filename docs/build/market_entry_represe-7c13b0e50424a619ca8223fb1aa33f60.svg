<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>Market Entry Game: extensive form linked to normal form</title>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1000" height="550" rx="12" fill="#FFFFFF"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Market Entry Game: Extensive Form Linked to Normal Form</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#475569">Payoffs listed as (Firm 1, Firm 2)</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: extensive form                                    -->
  <!-- ============================================================ -->
  <g>
    <rect x="16" y="76" width="430" height="456" rx="12" fill="#F8FAFC" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="231" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Extensive Form</text>

    <!-- P1 root node -->
    <text x="231" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Firm 1</text>
    <circle cx="231" cy="150" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>

    <!-- Stay Out branch (blue, muted outcome) -->
    <line x1="220" y1="161" x2="110" y2="238" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <rect x="118" y="183" width="76" height="22" rx="11" fill="#EFF6FF"/>
    <text x="156" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Stay Out</text>

    <circle cx="100" cy="250" r="6" fill="#1E293B"/>
    <text x="100" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">(0, 2)</text>
    <text x="100" y="296" text-anchor="middle" font-size="10" fill="#64748B">game ends</text>

    <!-- Enter branch (amber, leads to P2 node) -->
    <line x1="242" y1="161" x2="340" y2="238" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-amber)"/>
    <rect x="300" y="183" width="70" height="22" rx="11" fill="#FEF3C7"/>
    <text x="335" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Enter</text>

    <text x="340" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Firm 2</text>
    <circle cx="340" cy="250" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>

    <!-- Retaliate branch: dimmed / non-credible -->
    <line x1="330" y1="261" x2="270" y2="340" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arr-gray)"/>
    <rect x="222" y="285" width="90" height="22" rx="11" fill="#F1F5F9"/>
    <text x="267" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Retaliate</text>

    <circle cx="265" cy="352" r="6" fill="#94A3B8"/>
    <text x="265" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#64748B">(−1, −1)</text>
    <text x="265" y="398" text-anchor="middle" font-size="9.5" fill="#64748B">not credible: Firm 2</text>
    <text x="265" y="411" text-anchor="middle" font-size="9.5" fill="#64748B">prefers Cooperate (1 &gt; −1)</text>

    <!-- Cooperate branch: backward-induction outcome, highlighted -->
    <line x1="350" y1="261" x2="410" y2="340" stroke="#F59E0B" stroke-width="3" marker-end="url(#arr-amber)"/>
    <rect x="368" y="285" width="96" height="22" rx="11" fill="#FEF3C7"/>
    <text x="416" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Cooperate</text>

    <circle cx="410" cy="352" r="7" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
    <text x="410" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">(1, 1)</text>
    <text x="410" y="398" text-anchor="middle" font-size="9.5" fill="#92400E">backward-induction</text>
    <text x="410" y="411" text-anchor="middle" font-size="9.5" fill="#92400E">outcome (E, C)</text>

    <rect x="38" y="436" width="386" height="76" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="231" y="456" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400E">Solve by backward induction</text>
    <text x="231" y="474" text-anchor="middle" font-size="9.5" fill="#78350F">At Firm 2's node: Cooperate (1) beats Retaliate (−1).</text>
    <text x="231" y="490" text-anchor="middle" font-size="9.5" fill="#78350F">Anticipating this, Firm 1 compares Enter→1 to Stay Out→0,</text>
    <text x="231" y="506" text-anchor="middle" font-size="9.5" fill="#78350F">so Firm 1 enters: outcome (E, C) = (1, 1).</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: normal form                                      -->
  <!-- ============================================================ -->
  <g>
    <rect x="554" y="76" width="430" height="456" rx="12" fill="#F8FAFC" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="769" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Normal Form</text>

    <text x="769" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Firm 2</text>
    <text x="684" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">R (Retaliate)</text>
    <text x="854" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">C (Cooperate)</text>

    <text x="586" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B" transform="rotate(-90 586 246)">Firm 1</text>

    <!-- table grid: rows S, E ; cols R, C -->
    <!-- table origin -->
    <g transform="translate(614,168)">
      <rect x="0" y="0" width="300" height="140" fill="none" stroke="#1E293B" stroke-width="1.5"/>
      <line x1="150" y1="0" x2="150" y2="140" stroke="#1E293B" stroke-width="1.5"/>
      <line x1="0" y1="70" x2="300" y2="70" stroke="#1E293B" stroke-width="1.5"/>

      <!-- row labels -->
      <text x="-14" y="39" text-anchor="end" font-size="12" font-weight="600" fill="#475569">S</text>
      <text x="-14" y="109" text-anchor="end" font-size="12" font-weight="600" fill="#475569">E</text>

      <!-- cell (S,R): NE, but relies on a non-credible threat -->
      <rect x="4" y="4" width="142" height="62" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <text x="75" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#1E40AF">0, 2</text>

      <!-- cell (S,C) -->
      <text x="225" y="40" text-anchor="middle" font-size="15" fill="#334155">0, 2</text>

      <!-- cell (E,R) -->
      <text x="75" y="110" text-anchor="middle" font-size="15" fill="#334155">−1, −1</text>

      <!-- cell (E,C): backward-induction NE -->
      <rect x="154" y="74" width="142" height="62" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="225" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">1, 1</text>
    </g>

    <!-- legend pills -->
    <rect x="600" y="340" width="170" height="24" rx="12" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="685" y="356" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1E40AF">(S, R): Nash equilibrium</text>

    <rect x="600" y="372" width="200" height="34" rx="6" fill="none"/>
    <text x="600" y="386" font-size="9.5" fill="#475569">Neither firm can gain by deviating</text>
    <text x="600" y="399" font-size="9.5" fill="#475569">alone — but off the path, R is not credible.</text>

    <rect x="810" y="340" width="150" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="885" y="356" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400E">(E, C): also NE</text>

    <text x="810" y="386" font-size="9.5" fill="#475569">Matches the backward-induction</text>
    <text x="810" y="399" font-size="9.5" fill="#475569">outcome from the tree on the left.</text>

    <rect x="580" y="436" width="360" height="76" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="760" y="456" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1E40AF">(S, R) does not stop being a Nash equilibrium</text>
    <text x="760" y="474" text-anchor="middle" font-size="9.5" fill="#1E3A8A">It only requires that neither firm regrets its own</text>
    <text x="760" y="490" text-anchor="middle" font-size="9.5" fill="#1E3A8A">strategy given the other's. Credibility is a separate,</text>
    <text x="760" y="506" text-anchor="middle" font-size="9.5" fill="#1E3A8A">stronger requirement that (S, R) fails.</text>
  </g>

  <!-- ============================================================ -->
  <!-- CONNECTING ARROWS: strategy profile -> outcome cell           -->
  <!-- ============================================================ -->
  <path d="M 410 362 C 460 350, 500 324, 560 324 L 840 324 L 840 308" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <path d="M 100 262 C 170 330, 430 250, 660 203" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
</svg>
