<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="12" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Where Do a Sector's Sales Go?</text>

  <g transform="translate(24,64)">
    <rect width="852" height="226" rx="12" fill="#F8FAFC" stroke="#CBD5E1" filter="url(#shadow)"/>
    <rect x="36" y="74" width="190" height="80" rx="12" fill="#3B82F6" filter="url(#shadow)"/>
    <text x="131" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Total sales of sector i</text>
    <text x="131" y="136" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">xᵢ</text>

    <path d="M226,114 C280,114 280,67 330,67" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M226,114 C280,114 280,167 330,167" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-amber)"/>

    <rect x="342" y="28" width="242" height="78" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="463" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Intermediate sales</text>
    <text x="463" y="82" text-anchor="middle" font-size="19" font-weight="700" fill="#1E40AF">Σⱼ zᵢⱼ</text>
    <text x="463" y="98" text-anchor="middle" font-size="9" fill="#475569">purchased by other sectors</text>

    <rect x="342" y="128" width="242" height="78" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="463" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Final demand</text>
    <text x="463" y="182" text-anchor="middle" font-size="19" font-weight="700" fill="#92400E">dᵢ</text>
    <text x="463" y="198" text-anchor="middle" font-size="9" fill="#475569">purchased for final use</text>

    <rect x="628" y="62" width="188" height="102" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="722" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">The accounts must balance</text>
    <text x="722" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">xᵢ = Σⱼ zᵢⱼ + dᵢ</text>
    <text x="722" y="145" text-anchor="middle" font-size="10" fill="#64748B">sales = intermediate + final</text>
  </g>

  <line x1="450" y1="298" x2="450" y2="320" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(112,326)">
    <rect width="676" height="62" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="338" y="24" text-anchor="middle" font-size="11" fill="#475569">Since zᵢⱼ = aᵢⱼxⱼ for every transaction, stack all sectors together:</text>
    <text x="338" y="49" text-anchor="middle" font-size="19" font-weight="700" fill="#1E40AF">xᵢ = Σⱼ aᵢⱼxⱼ + dᵢ    ⟶    x = Ax + d</text>
  </g>
</svg>
