<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="480" rx="12" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <text x="450" y="34" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Multihoming and the Competitive Bottleneck</text>
  <text x="450" y="54" font-size="11" fill="#64748B" text-anchor="middle">Armstrong: platforms court the side that single-homes and tax the side that multihomes</text>

  <!-- Platform A -->
  <rect x="60" y="100" width="150" height="70" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="135" y="140" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Platform A</text>

  <!-- Platform B -->
  <rect x="690" y="100" width="150" height="70" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="765" y="140" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Platform B</text>

  <!-- Single-homing group split: left tied only to A, right tied only to B -->
  <rect x="30" y="220" width="200" height="110" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="240" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">single-homers (A only)</text>
  <circle cx="75" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="130" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="185" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="102" cy="305" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="158" cy="305" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>

  <rect x="670" y="220" width="200" height="110" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="770" y="240" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">single-homers (B only)</text>
  <circle cx="715" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="770" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="825" cy="275" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="742" cy="305" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="798" cy="305" r="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>

  <!-- ties from single-homing groups to their platform only -->
  <path d="M130,220 L135,170" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M770,220 L765,170" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="35" y="340" width="190" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="130" y="358" font-size="11" fill="#166534" text-anchor="middle">courted: low or negative price</text>
  <rect x="675" y="340" width="190" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="770" y="358" font-size="11" fill="#166534" text-anchor="middle">courted: low or negative price</text>

  <!-- Multihoming group in the middle, tied to BOTH platforms -->
  <rect x="340" y="190" width="220" height="150" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="212" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">multihomers (A and B)</text>
  <circle cx="390" cy="250" r="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="450" cy="250" r="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="510" cy="250" r="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="420" cy="285" r="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="480" cy="285" r="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>

  <path d="M380,190 C320,160 230,145 212,135" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M520,190 C580,160 670,145 688,135" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <rect x="355" y="345" width="190" height="26" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="450" y="363" font-size="11" fill="#991B1B" text-anchor="middle">taxed: higher price</text>

  <!-- Annotation -->
  <rect x="70" y="400" width="760" height="56" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="422" font-size="12.5" fill="#334155" text-anchor="middle">A single-homer can only be reached through its one platform, so platforms compete hard</text>
  <text x="450" y="440" font-size="12.5" fill="#334155" text-anchor="middle">(low prices) for single-homers, then charge multihomers for access to them</text>
</svg>
