<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="title">Count neighbors, then decide</title><desc id="desc">With wanted_neighbors equal to four, a blue focal agent with three blue neighbors moves to an available empty lot, while an agent with four blue neighbors stays. All eight surrounding lots, including diagonals, are considered; empty lots do not count. A non-periodic corner has only three neighboring lots, so it cannot satisfy a threshold of four.</desc><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#10B981"/></marker></defs><rect width="850" height="450" rx="12" fill="#FFFFFF"/><text x="425.0" y="34" font-size="20" fill="#1E293B" font-weight="700" text-anchor="middle">Count neighbors, then decide</text><g filter="url(#shadow)"><rect x="20" y="65" width="395" height="260" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="20" y="65" width="395" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="36" y="88" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">Three similar neighbors</text><g filter="url(#shadow)"><rect x="435" y="65" width="395" height="260" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="435" y="65" width="395" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="451" y="88" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">Four similar neighbors</text><rect x="44" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="89" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="134" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="44" y="168" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="89" y="168" width="45" height="45" rx="0" fill="#D1FAE5" stroke="#CBD5E1"/><rect x="134" y="168" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="44" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="89" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="134" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="111.5" cy="190.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="111.5" y="194.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="66.5" cy="145.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="156.5" cy="145.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="66.5" cy="235.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><rect x="101.5" y="135.5" width="20" height="20" rx="2" fill="#F59E0B" stroke="#92400E"/><rect x="56.5" y="180.5" width="20" height="20" rx="2" fill="#F59E0B" stroke="#92400E"/><rect x="146.5" y="225.5" width="20" height="20" rx="2" fill="#F59E0B" stroke="#92400E"/><text x="204" y="158" font-size="13" fill="#1E293B" font-weight="600" text-anchor="start">have = 3</text><text x="204" y="184" font-size="13" fill="#1E293B" font-weight="600" text-anchor="start">want = 4</text><text x="204" y="217" font-size="12" fill="#475569" font-weight="400" text-anchor="start">3 ≥ 4? No</text><text x="204" y="246" font-size="12" fill="#065F46" font-weight="600" text-anchor="start">Move to an empty lot</text><text x="44" y="289" font-size="10" fill="#475569" font-weight="400" text-anchor="start">A = agent taking its turn</text><text x="44" y="306" font-size="10" fill="#475569" font-weight="400" text-anchor="start">Unmarked white lots are empty.</text><rect x="459" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="504" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="549" y="123" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="459" y="168" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="504" y="168" width="45" height="45" rx="0" fill="#D1FAE5" stroke="#CBD5E1"/><rect x="549" y="168" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="459" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="504" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="549" y="213" width="45" height="45" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="526.5" cy="190.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="526.5" y="194.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="481.5" cy="145.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="571.5" cy="145.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="481.5" cy="235.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><rect x="516.5" y="135.5" width="20" height="20" rx="2" fill="#F59E0B" stroke="#92400E"/><rect x="471.5" y="180.5" width="20" height="20" rx="2" fill="#F59E0B" stroke="#92400E"/><circle cx="571.5" cy="235.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="619" y="158" font-size="13" fill="#1E293B" font-weight="600" text-anchor="start">have = 4</text><text x="619" y="184" font-size="13" fill="#1E293B" font-weight="600" text-anchor="start">want = 4</text><text x="619" y="217" font-size="12" fill="#475569" font-weight="400" text-anchor="start">4 ≥ 4? Yes</text><text x="619" y="246" font-size="12" fill="#065F46" font-weight="600" text-anchor="start">Stay in this lot</text><text x="459" y="289" font-size="10" fill="#475569" font-weight="400" text-anchor="start">A = agent taking its turn</text><text x="459" y="306" font-size="10" fill="#475569" font-weight="400" text-anchor="start">Unmarked white lots are empty.</text><rect x="20" y="342" width="810" height="65" rx="8" fill="#EFF6FF" stroke="#DBEAFE"/><rect x="34" y="352" width="22" height="22" rx="0" fill="#D1FAE5" stroke="#CBD5E1"/><rect x="56" y="352" width="22" height="22" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="34" y="374" width="22" height="22" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="56" y="374" width="22" height="22" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="45.0" cy="363.0" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="45.0" y="367.0" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><text x="97" y="365" font-size="13" fill="#1E293B" font-weight="600" text-anchor="start">What if A lives in a corner?</text><text x="97" y="387" font-size="12" fill="#475569" font-weight="400" text-anchor="start">Only three neighboring lots exist. With want = 4, A must move.</text><text x="425" y="430" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">We count similar agents, including diagonal neighbors. We do not use a percentage.</text></svg>