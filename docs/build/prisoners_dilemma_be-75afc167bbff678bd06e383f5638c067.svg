<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#D97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="820" height="480" rx="12" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Best Responses Converge on (Confess, Confess)</text>
  <text x="410" y="44" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">Payoffs shown as (Suspect 1, Suspect 2)</text>

  <!-- Suspect 2 column group label -->
  <text x="508" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Suspect 2 chooses</text>
  <text x="370" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Not Confess</text>
  <text x="645" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Confess</text>

  <!-- Suspect 1 row group label (rotated) -->
  <text x="40" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF" transform="rotate(-90 40 212)">Suspect 1 chooses</text>
  <text x="235" y="146" text-anchor="end" font-size="12" font-weight="600" fill="#475569">Not Confess</text>
  <text x="235" y="291" text-anchor="end" font-size="12" font-weight="600" fill="#475569">Confess</text>

  <!-- ================= Grid cells ================= -->
  <!-- (Not Confess, Not Confess) -->
  <g>
    <rect x="260" y="92" width="220" height="95" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="370" y="114" text-anchor="middle" font-size="10" fill="#94A3B8">(Not Confess, Not Confess)</text>
    <text x="370" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">-1, -1</text>
    <text x="370" y="170" text-anchor="middle" font-size="9.5" fill="#94A3B8">1 year each</text>
  </g>

  <!-- (Not Confess, Confess) -->
  <g>
    <rect x="535" y="92" width="220" height="95" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="645" y="114" text-anchor="middle" font-size="10" fill="#94A3B8">(Not Confess, Confess)</text>
    <text x="645" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">-10, 0</text>
    <text x="645" y="170" text-anchor="middle" font-size="9.5" fill="#94A3B8">S1: 10 yrs / S2: free</text>
  </g>

  <!-- (Confess, Not Confess) -->
  <g>
    <rect x="260" y="237" width="220" height="95" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="370" y="259" text-anchor="middle" font-size="10" fill="#94A3B8">(Confess, Not Confess)</text>
    <text x="370" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">0, -10</text>
    <text x="370" y="315" text-anchor="middle" font-size="9.5" fill="#94A3B8">S1: free / S2: 10 yrs</text>
  </g>

  <!-- (Confess, Confess) - equilibrium -->
  <g>
    <rect x="535" y="237" width="220" height="95" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
    <text x="645" y="259" text-anchor="middle" font-size="10" fill="#059669">(Confess, Confess)</text>
    <text x="645" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">-4, -4</text>
    <text x="645" y="315" text-anchor="middle" font-size="9.5" fill="#059669">4 years each</text>
  </g>

  <!-- ================= Player 1 (row) best-response arrows: vertical, blue ================= -->
  <line x1="370" y1="189" x2="370" y2="235" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="645" y1="189" x2="645" y2="235" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="378" y="216" font-size="9.5" font-weight="600" fill="#1E40AF">S1 BR: Confess</text>
  <text x="485" y="216" font-size="9.5" font-weight="600" fill="#1E40AF">S1 BR: Confess</text>

  <!-- ================= Player 2 (column) best-response arrows: horizontal, amber ================= -->
  <line x1="482" y1="139" x2="533" y2="139" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <line x1="482" y1="284" x2="533" y2="284" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="438" y="128" font-size="9.5" font-weight="600" fill="#92400E">S2 BR: Confess</text>
  <text x="438" y="300" font-size="9.5" font-weight="600" fill="#92400E">S2 BR: Confess</text>

  <!-- Equilibrium callout -->
  <line x1="645" y1="332" x2="645" y2="354" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="525" y="358" width="240" height="32" rx="16" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="645" y="379" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Nash Equilibrium</text>

  <!-- Legend -->
  <g transform="translate(40, 418)">
    <line x1="0" y1="6" x2="30" y2="6" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="38" y="10" font-size="11" fill="#475569">Suspect 1's best response (within a column)</text>

    <line x1="400" y1="6" x2="430" y2="6" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
    <text x="438" y="10" font-size="11" fill="#475569">Suspect 2's best response (within a row)</text>
  </g>
  <g transform="translate(40, 446)">
    <rect x="0" y="-2" width="18" height="14" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="26" y="10" font-size="11" fill="#475569">Mutual best response: both players' arrows point here, so neither wants to deviate</text>
  </g>
</svg>
