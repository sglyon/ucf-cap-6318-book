<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="title">One model step contains many agent decisions</title><desc id="desc">A worked example with wanted_neighbors equal to four and one possible activation order. A has one blue neighbor and moves to an empty lot. B then sees the updated grid: it now has three blue neighbors rather than four, so it also moves to an empty lot. Other agents take their turns before the next model step. The destination examples are available empty lots, not searches for happier locations.</desc><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#10B981"/></marker></defs><rect width="960" height="465" rx="12" fill="#FFFFFF"/><text x="480.0" y="34" font-size="20" fill="#1E293B" font-weight="700" text-anchor="middle">One model step contains many agent decisions</text><text x="480" y="57" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">want = 4 · one possible activation order · small crop of the 25 × 25 grid</text><g filter="url(#shadow)"><rect x="20" y="80" width="270" height="290" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="20" y="80" width="270" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="36" y="103" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">1. A takes its turn</text><rect x="67" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="102" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="137" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="172" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="207" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="67" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="102" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="137" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="172" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="207" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="67" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="102" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="137" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="172" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="207" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="67" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="102" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="137" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="172" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="207" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="67" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="102" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="137" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="172" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="207" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="154.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="154.5" y="225.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="189.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="189.5" y="225.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><circle cx="224.5" cy="186.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="224.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="224.5" cy="256.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="35" y="335" font-size="11" fill="#475569" font-weight="400" text-anchor="start">A has 1 similar neighbor.</text><text x="35" y="355" font-size="11" fill="#475569" font-weight="400" text-anchor="start">1 &lt; 4: A moves to an empty lot.</text><g filter="url(#shadow)"><rect x="345" y="80" width="270" height="290" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="345" y="80" width="270" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="361" y="103" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">2. B sees the updated grid</text><rect x="392" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="427" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="462" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="497" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="532" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="392" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="427" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="462" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="497" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="532" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="392" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="427" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="462" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="497" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="532" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="392" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="427" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="462" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="497" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="532" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="392" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="427" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="462" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="497" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="532" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="514.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="514.5" y="225.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><circle cx="549.5" cy="186.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="549.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="549.5" cy="256.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="409.5" cy="291.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="409.5" y="295.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><text x="360" y="335" font-size="11" fill="#475569" font-weight="400" text-anchor="start">B now has 3 similar neighbors.</text><text x="360" y="355" font-size="11" fill="#475569" font-weight="400" text-anchor="start">3 &lt; 4: B moves to an empty lot.</text><g filter="url(#shadow)"><rect x="670" y="80" width="270" height="290" rx="12" fill="#ECFDF5" stroke="#10B981"/></g><rect x="670" y="80" width="270" height="35" rx="12" fill="#D1FAE5" stroke="#D1FAE5"/><text x="686" y="103" font-size="15" fill="#065F46" font-weight="600" text-anchor="start">3. The step continues</text><rect x="717" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="752" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="787" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="822" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="857" y="134" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="717" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="752" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="787" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="822" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="857" y="169" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="717" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="752" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="787" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="822" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="857" y="204" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="717" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="752" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="787" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="822" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="857" y="239" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="717" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="752" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="787" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="822" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="857" y="274" width="35" height="35" rx="0" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="874.5" cy="186.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="874.5" cy="221.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="874.5" cy="256.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><circle cx="734.5" cy="291.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="734.5" y="295.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><circle cx="734.5" cy="151.5" r="11" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/><text x="734.5" y="155.5" font-size="10" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><text x="685" y="335" font-size="11" fill="#475569" font-weight="400" text-anchor="start">The remaining agents take turns.</text><text x="685" y="355" font-size="11" fill="#475569" font-weight="400" text-anchor="start">Then we start the next model step.</text><path d="M 296 225 L 333 225" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/><path d="M 621 225 L 658 225" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="404" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">A’s move changes the neighborhood B observes. Could a different order change the result?</text><text x="480" y="433" font-size="11" fill="#065F46" font-weight="400" text-anchor="middle">Moves use available empty lots; agents do not search for a happier destination.</text></svg>