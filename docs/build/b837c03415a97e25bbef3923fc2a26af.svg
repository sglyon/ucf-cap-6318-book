<circle cx="85" cy="379" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="85" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">L</text>
<circle cx="355" cy="379" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="355" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">R</text>
<path d="M61 379 L43 379 L43 357 L395 357 L395 379 L381 379" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="220" y="384" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Opposite edges connect</text>
<text x="612" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">Periodic grid: boundary neighbors can interact.</text>
<text x="612" y="394" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">The agents stay at their positions.</text>
<text x="425" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">Now we change who can receive the unit. Does the total wealth change?</text>
