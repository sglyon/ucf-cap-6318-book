<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#10B981"/></marker></defs>
<rect width="850" height="450" rx="12" fill="#FFFFFF"/>
<title id="title">Who can receive the unit?</title><desc id="desc">Two model environments use the same one-unit transfer. In the nonspatial model, any agent can be chosen, including the donor. In the grid model, a recipient is chosen from nearby agents; one possible neighbor is illustrated, not a full neighborhood stencil. Opposite edges of the periodic grid connect. Agents remain at their positions.</desc>
<text x="425" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Who can receive the unit?</text>
<rect x="25" y="60" width="390" height="276" filter="url(#shadow)" rx="12" fill="#ECFDF5" stroke="#10B981"/>
<rect x="435" y="60" width="390" height="276" filter="url(#shadow)" rx="12" fill="#ECFDF5" stroke="#10B981"/>
<text x="220" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">No space</text>
<text x="630" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">GridSpace</text>
<path d="M210 184 L95 130" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M210 184 L280 128" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M210 184 L340 202" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M210 184 L145 239" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="95" cy="130" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="95" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">B</text>
