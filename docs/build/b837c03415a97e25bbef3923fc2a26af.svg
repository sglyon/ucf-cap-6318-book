<circle cx="340" cy="202" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="340" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">D</text>
<circle cx="145" cy="239" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="145" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">E</text>
<circle cx="210" cy="184" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="210" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">A</text>
<path d="M234 184 L315 197" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="287" y="174" text-anchor="middle" font-size="10" font-weight="400" fill="#065F46">1 unit</text>
<text x="220" y="292" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Choose from all agents.</text>
<text x="220" y="311" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">A can also select itself: no net change.</text>
