<text x="630" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Choose from nearby agents.</text>
<text x="630" y="286" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">One possible recipient shown.</text>
<text x="630" y="305" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">Schematic; not the full neighbor set.</text>
