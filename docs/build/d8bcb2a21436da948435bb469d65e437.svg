<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>
  <rect width="900" height="460" rx="12" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">How to Read an Input-Output Coefficient</text>

  <g transform="translate(24,62)">
    <rect width="400" height="332" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="400" height="38" rx="12" fill="#3B82F6"/>
    <rect y="26" width="400" height="12" fill="#3B82F6"/>
    <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Start with one concrete purchase</text>

    <circle cx="104" cy="128" r="48" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="104" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Sector i</text>
    <text x="104" y="141" text-anchor="middle" font-size="10" fill="#475569">supplier</text>
    <circle cx="296" cy="128" r="48" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="296" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Sector j</text>
    <text x="296" y="141" text-anchor="middle" font-size="10" fill="#475569">buyer</text>
    <line x1="154" y1="128" x2="240" y2="128" stroke="#3B82F6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="163" y="94" width="74" height="24" rx="12" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="200" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">$20 input</text>
    <text x="200" y="190" text-anchor="middle" font-size="11" fill="#475569">Sector j has $100 in total sales</text>

    <rect x="42" y="216" width="316" height="78" rx="10" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="200" y="242" text-anchor="middle" font-size="12" fill="#475569">input purchased from i by j</text>
    <line x1="91" y1="250" x2="309" y2="250" stroke="#94A3B8"/>
    <text x="200" y="270" text-anchor="middle" font-size="12" fill="#475569">total sales of buyer j</text>
    <text x="200" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">a<tspan baseline-shift="sub" font-size="9">ij</tspan> = 20 / 100 = 0.20</text>
    <rect x="99" y="304" width="202" height="20" rx="10" fill="#DBEAFE"/>
    <text x="200" y="318" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">20 cents of input per $1 of output</text>
  </g>

  <g transform="translate(448,62)">
    <rect width="428" height="332" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="214" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Then locate the same relationship in A</text>

    <text x="60" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">supplier</text>
    <text x="242" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">buyer sector (column)</text>
    <text x="54" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#475569" transform="rotate(-90 54 164)">supplier sector (row)</text>

    <g transform="translate(104,70)">
      <rect x="0" y="0" width="78" height="42" fill="#F1F5F9" stroke="#CBD5E1"/>
      <rect x="78" y="0" width="78" height="42" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <rect x="156" y="0" width="78" height="42" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="39" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">buyer 1</text>
      <text x="117" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">buyer j</text>
      <text x="195" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">buyer 3</text>

      <rect x="-64" y="42" width="64" height="56" fill="#F1F5F9" stroke="#CBD5E1"/>
      <rect x="-64" y="98" width="64" height="56" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <rect x="-64" y="154" width="64" height="56" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="-32" y="75" text-anchor="middle" font-size="11" fill="#475569">row 1</text>
      <text x="-32" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">row i</text>
      <text x="-32" y="187" text-anchor="middle" font-size="11" fill="#475569">row 3</text>

      <rect x="0" y="42" width="78" height="56" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="78" y="42" width="78" height="56" fill="#EFF6FF" stroke="#93C5FD"/>
      <rect x="156" y="42" width="78" height="56" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="0" y="98" width="78" height="56" fill="#EFF6FF" stroke="#93C5FD"/>
      <rect x="78" y="98" width="78" height="56" rx="4" fill="#3B82F6" stroke="#1E40AF" stroke-width="2.5"/>
      <rect x="156" y="98" width="78" height="56" fill="#EFF6FF" stroke="#93C5FD"/>
      <rect x="0" y="154" width="78" height="56" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="78" y="154" width="78" height="56" fill="#EFF6FF" stroke="#93C5FD"/>
      <rect x="156" y="154" width="78" height="56" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="39" y="76" text-anchor="middle" font-size="11" fill="#64748B">a₁₁</text>
      <text x="117" y="76" text-anchor="middle" font-size="11" fill="#1E40AF">a₁ⱼ</text>
      <text x="195" y="76" text-anchor="middle" font-size="11" fill="#64748B">a₁₃</text>
      <text x="39" y="132" text-anchor="middle" font-size="11" fill="#1E40AF">aᵢ₁</text>
      <text x="117" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">aᵢⱼ</text>
      <text x="195" y="132" text-anchor="middle" font-size="11" fill="#1E40AF">aᵢ₃</text>
      <text x="39" y="188" text-anchor="middle" font-size="11" fill="#64748B">a₃₁</text>
      <text x="117" y="188" text-anchor="middle" font-size="11" fill="#1E40AF">a₃ⱼ</text>
      <text x="195" y="188" text-anchor="middle" font-size="11" fill="#64748B">a₃₃</text>
    </g>

    <rect x="72" y="294" width="284" height="25" rx="12" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="214" y="311" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">row i supplies  ·  column j uses  ·  edge i → j</text>
  </g>
  <text x="450" y="430" text-anchor="middle" font-size="10" fill="#64748B">The column identifies whose production is being normalized; the row identifies the supplying sector.</text>
</svg>
