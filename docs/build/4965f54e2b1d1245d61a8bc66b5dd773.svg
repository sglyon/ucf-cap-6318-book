<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     width="900" height="620"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-axis" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#1E293B"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#D97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="900" height="620" rx="12" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E293B">Three Routes Across the Critical Mass Frontier</text>
  <text x="450" y="52" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">Participation plane (n_A, n_B); starting at the origin, each strategy takes a different path to ignition</text>

  <!-- Growth zone background (whole plot area) -->
  <rect x="130" y="80" width="650.5" height="400" fill="#EFF6FF"/>

  <!-- Implosion zone -->
  <path d="M130,480 L130,102.2 L152.4,140.0 L165.1,170.6 L177.8,195.8 L190.4,217.0 L203.1,235.0 L215.8,250.6 L228.4,264.1 L241.1,276.0 L253.8,286.6 L266.4,296.0 L279.1,304.4 L291.8,312.0 L304.4,318.9 L317.1,325.2 L329.8,330.9 L342.4,336.2 L355.1,341.0 L367.8,345.5 L380.4,349.7 L393.1,353.6 L405.8,357.2 L418.5,360.6 L431.1,363.8 L443.8,366.7 L456.5,369.5 L469.1,372.1 L481.8,374.6 L494.5,376.9 L507.1,379.1 L519.8,381.1 L532.5,383.1 L545.1,384.9 L557.8,386.6 L570.5,388.3 L583.1,389.8 L595.8,391.3 L608.5,392.7 L621.1,394.0 L633.8,395.2 L646.5,396.4 L659.1,397.6 L671.8,398.6 L684.5,399.7 L697.1,400.6 L709.8,401.5 L722.5,402.4 L735.1,403.2 L747.8,404.0 L760.5,404.7 L760.5,480 Z" fill="#FEF3C7"/>

  <!-- Frontier curve (base) -->
  <path d="M139.8,102.2 L152.4,140.0 L165.1,170.6 L177.8,195.8 L190.4,217.0 L203.1,235.0 L215.8,250.6 L228.4,264.1 L241.1,276.0 L253.8,286.6 L266.4,296.0 L279.1,304.4 L291.8,312.0 L304.4,318.9 L317.1,325.2 L329.8,330.9 L342.4,336.2 L355.1,341.0 L367.8,345.5 L380.4,349.7 L393.1,353.6 L405.8,357.2 L418.5,360.6 L431.1,363.8 L443.8,366.7 L456.5,369.5 L469.1,372.1 L481.8,374.6 L494.5,376.9 L507.1,379.1 L519.8,381.1 L532.5,383.1 L545.1,384.9 L557.8,386.6 L570.5,388.3 L583.1,389.8 L595.8,391.3 L608.5,392.7 L621.1,394.0 L633.8,395.2 L646.5,396.4 L659.1,397.6 L671.8,398.6 L684.5,399.7 L697.1,400.6 L709.8,401.5 L722.5,402.4 L735.1,403.2 L747.8,404.0 L760.5,404.7"
        fill="none" stroke="#92400E" stroke-width="2.5"/>

  <!-- Shifted frontier (marquee participants / self-supply pull it toward the origin) -->
  <path d="M139.8,245.3 L152.4,268.0 L165.1,286.3 L177.8,301.5 L190.4,314.2 L203.1,325.0 L215.8,334.4 L228.4,342.5 L241.1,349.6 L253.8,355.9 L266.4,361.6 L279.1,366.6 L291.8,371.2 L304.4,375.3 L317.1,379.1 L329.8,382.6 L342.4,385.7 L355.1,388.6 L367.8,391.3 L380.4,393.8 L393.1,396.1 L405.8,398.3 L418.5,400.4 L431.1,402.3 L443.8,404.1 L456.5,405.7 L469.1,407.3 L481.8,408.8 L494.5,410.3 L507.1,411.6 L519.8,412.9 L532.5,414.1 L545.1,415.2 L557.8,416.3 L570.5,417.4 L583.1,418.4 L595.8,419.3 L608.5,420.2 L621.1,421.1 L633.8,421.9 L646.5,422.7 L659.1,423.4 L671.8,424.1 L684.5,424.8 L697.1,425.5 L709.8,426.1 L722.5,426.7 L735.1,427.3 L747.8,427.9 L760.5,428.4"
        fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Axes -->
  <line x1="130" y1="480" x2="792" y2="480" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <line x1="130" y1="480" x2="130" y2="72" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="800" y="484" font-size="13" font-weight="600" fill="#1E293B">n_A</text>
  <text x="130" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">n_B</text>
  <text x="122" y="494" text-anchor="end" font-size="10.5" fill="#64748B">(0,0)</text>

  <!-- Zone labels -->
  <text x="700" y="110" text-anchor="end" font-size="13" font-weight="700" fill="#1E40AF">Growth zone</text>
  <text x="700" y="126" text-anchor="end" font-size="9.5" fill="#1E40AF">cross-side effects reinforce upward</text>
  <text x="190" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Implosion zone</text>
  <text x="190" y="456" text-anchor="middle" font-size="9.5" fill="#92400E">participation decays to zero</text>

  <!-- Frontier label -->
  <text x="420" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400E" transform="rotate(-18 420 330)">critical mass frontier</text>

  <!-- Shifted-frontier annotation omitted in-plot; explained in legend -->

  <!-- Zigzag path (amber) -->
  <path d="M130.0,480.0 L130.0,408.0 L247.0,408.0 L247.0,320.0 L390.0,320.0 L390.0,232.0 L533.0,232.0 L533.0,160.0"
        fill="none" stroke="#D97706" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>

  <!-- Two-step path (blue) -->
  <path d="M130.0,480.0 L637.0,468.0 L637.0,260.0"
        fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

  <!-- Commitment path (purple): solid step then dashed jump -->
  <path d="M130.0,480.0 L273.0,452.0"
        fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round"/>
  <path d="M273.0,452.0 L273.0,248.0"
        fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrow-purple)"/>
  <circle cx="273.0" cy="452.0" r="4" fill="#7C3AED"/>

  <!-- Start marker -->
  <circle cx="130" cy="480" r="5" fill="#1E293B"/>

  <!-- Legend card -->
  <rect x="100" y="505" width="760" height="95" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="122" y="528" font-size="12.5" font-weight="700" fill="#1E293B">Three ways to cross the frontier</text>

  <line x1="122" y1="546" x2="152" y2="546" stroke="#D97706" stroke-width="3"/>
  <text x="159" y="550" font-size="10.5" fill="#475569"><tspan font-weight="600" fill="#92400E">Zigzag (YouTube):</tspan> alternate small gains on each side</text>

  <line x1="122" y1="566" x2="152" y2="566" stroke="#3B82F6" stroke-width="3"/>
  <text x="159" y="570" font-size="10.5" fill="#475569"><tspan font-weight="600" fill="#1E40AF">Two-step (OpenTable):</tspan> build one side first, then climb the other</text>

  <line x1="122" y1="586" x2="152" y2="586" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="159" y="590" font-size="10.5" fill="#475569"><tspan font-weight="600" fill="#5B21B6">Commitment (Xbox):</tspan> a promise jumps expected participation</text>

  <line x1="490" y1="546" x2="520" y2="546" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="527" y="550" font-size="10" fill="#64748B">Shifted frontier: marquee / self-supply</text>

  <rect x="490" y="560" width="16" height="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="512" y="570" font-size="10" fill="#64748B">Growth zone</text>
  <rect x="490" y="578" width="16" height="12" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
  <text x="512" y="588" font-size="10" fill="#64748B">Implosion zone</text>
</svg>
