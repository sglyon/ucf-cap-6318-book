<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#10B981"/></marker></defs>
<rect width="850" height="450" rx="12" fill="#FFFFFF"/>
<title id="title">One exchange, unchanged total</title><desc id="desc">Before: agents A, B, and C each have one unit. A gives one unit to B. After: their wealth is zero, two, and one. Total wealth stays at three. An agent with zero wealth skips giving but can still receive. The nonspatial implementation can choose the donor as recipient, causing no net change.</desc>
<text x="425" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">One exchange, unchanged total</text>
<rect x="30" y="65" width="360" height="235" filter="url(#shadow)" rx="12" fill="#ECFDF5" stroke="#10B981"/>
<text x="210" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">Before</text>
<circle cx="100" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="100" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">A</text>
<text x="100" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 unit</text>
<circle cx="100" cy="221" r="6" fill="#10B981"/><circle cx="210" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="210" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">B</text>
<text x="210" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 unit</text>
<circle cx="210" cy="221" r="6" fill="#10B981"/><circle cx="320" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="320" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">C</text>
<text x="320" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 unit</text>
<circle cx="320" cy="221" r="6" fill="#10B981"/><rect x="125" y="253" width="170" height="28" rx="12" fill="#D1FAE5" stroke="#10B981"/>
<text x="210" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">Total wealth = 3</text>
<rect x="460" y="65" width="360" height="235" filter="url(#shadow)" rx="12" fill="#ECFDF5" stroke="#10B981"/>
<text x="640" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">After</text>
<circle cx="530" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="530" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">A</text>
<text x="530" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">0 units</text>
<circle cx="640" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="640" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">B</text>
<text x="640" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">2 units</text>
<circle cx="632" cy="221" r="6" fill="#10B981"/><circle cx="648" cy="221" r="6" fill="#10B981"/><circle cx="750" cy="150" r="24" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/><text x="750" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">C</text>
<text x="750" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">1 unit</text>
<circle cx="750" cy="221" r="6" fill="#10B981"/><rect x="555" y="253" width="170" height="28" rx="12" fill="#D1FAE5" stroke="#10B981"/>
<text x="640" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">Total wealth = 3</text>
<path d="M397 175 L450 175" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="425" y="133" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">A gives</text>
<text x="425" y="147" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">B 1 unit</text>
<rect x="30" y="318" width="790" height="53" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="425" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">If wealth is 0: skip giving.</text>
<text x="425" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">An agent with no wealth can still receive a unit.</text>
<text x="425" y="396" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">If the nonspatial model selects the donor as recipient, wealth stays unchanged.</text>
<text x="425" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">What changes after an exchange? What stays the same?</text>
</svg>