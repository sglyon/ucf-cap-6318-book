<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">First-price bidding: keep more or lose the item</title><desc id="desc">With valuation 70 and highest competing bid 50, bidding 70 wins with payoff 0, bidding 65 wins with payoff 5, and bidding 45 loses with payoff 0. The competing bid is unknown when bidding; these are examples, not optimal bids.</desc>
<defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker></defs>
<rect width="900" height="430" rx="12" fill="#FFFFFF"/>
<text x="450" y="34" text-anchor="middle" font-size="20" fill="#1E293B" font-weight="700">Bid Less, Keep More—or Lose the Item</text>
<text x="450" y="61" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">Our value: $70  •  Highest competing bid: $50 (unknown when we choose)</text>
<line x1="72" y1="148" x2="828" y2="148" stroke="#94A3B8" stroke-width="2.5"/>
<line x1="72.0" y1="143" x2="72.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="72.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$40</text>
<line x1="198.0" y1="143" x2="198.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="198.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$45</text>
<line x1="324.0" y1="143" x2="324.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="324.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$50</text>
<line x1="450.0" y1="143" x2="450.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="450.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$55</text>
<line x1="576.0" y1="143" x2="576.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="576.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$60</text>
<line x1="702.0" y1="143" x2="702.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="702.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$65</text>
<line x1="828.0" y1="143" x2="828.0" y2="153" stroke="#94A3B8" stroke-width="2.5"/>
<text x="828.0" y="175" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">$70</text>
<text x="450" y="199" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">Our bid</text>
<line x1="324.0" y1="92" x2="324.0" y2="154" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3"/>
<text x="324.0" y="83" text-anchor="middle" font-size="11" fill="#1E40AF" font-weight="600">Competing bid</text>
<circle cx="198.0" cy="148" r="6" fill="#F59E0B" stroke="#92400E"/>
<circle cx="702.0" cy="148" r="6" fill="#F59E0B" stroke="#92400E"/>
<circle cx="828.0" cy="148" r="6" fill="#F59E0B" stroke="#92400E"/>
<rect x="24" y="222" width="268" height="126" rx="12" fill="#FFFBEB" stroke="#FEF3C7" filter="url(#shadow)"/>
<text x="158" y="250" text-anchor="middle" font-size="15" fill="#92400E" font-weight="600">Bid $45: lose</text>
<text x="158" y="279" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">We pay $0.</text>
<text x="158" y="309" text-anchor="middle" font-size="13" fill="#1E293B" font-weight="600">Payoff: $0; no item</text>
<rect x="316" y="222" width="268" height="126" rx="12" fill="#FFFBEB" stroke="#FEF3C7" filter="url(#shadow)"/>
<text x="450" y="250" text-anchor="middle" font-size="15" fill="#92400E" font-weight="600">Bid $65: win</text>
<text x="450" y="279" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">We pay $65.</text>
<text x="450" y="309" text-anchor="middle" font-size="13" fill="#1E293B" font-weight="600">Payoff: $70 − $65 = $5</text>
<rect x="608" y="222" width="268" height="126" rx="12" fill="#FFFBEB" stroke="#FEF3C7" filter="url(#shadow)"/>
<text x="742" y="250" text-anchor="middle" font-size="15" fill="#92400E" font-weight="600">Bid $70: win</text>
<text x="742" y="279" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">We pay $70.</text>
<text x="742" y="309" text-anchor="middle" font-size="13" fill="#1E293B" font-weight="600">Payoff: $70 − $70 = $0</text>
<text x="450" y="376" text-anchor="middle" font-size="12" fill="#1E293B" font-weight="600">A lower bid leaves more payoff if we win. What happens when we lower it too far?</text>
<text x="450" y="403" text-anchor="middle" font-size="10" fill="#475569" font-weight="400">Fixed competing bid for illustration; no optimal bid is calculated. Exact ties are omitted.</text>
</svg>
