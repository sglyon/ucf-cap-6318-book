<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="380" rx="12" fill="#FFFFFF"/>
  <text x="500" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Iterated Elimination of Dominated Strategies: Marketing Game</text>
  <text x="500" y="38" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748B">Rows: Firm 1 &#183; Columns: Firm 2 &#183; Payoffs: (Firm 1, Firm 2)</text>

  <!-- ======================= STAGE 1: FULL GAME (panel origin x=15) ======================= -->
  <g transform="translate(15, 56)">
    <text x="150" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Stage 1 &#8212; Full Game</text>

    <text x="165" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400E">Firm 2</text>
    <text x="118" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Low-Price</text>
    <text x="213" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Upscale</text>
    <text x="60" y="80" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Low-Price</text>
    <text x="60" y="154" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Upscale</text>

    <!-- grid: col1 x=71 col2 x=166, w=95 each; row1 y=44 row2 y=118 h=74 -->
    <rect x="71" y="44" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="118.5" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.48, 0.12</text>

    <rect x="166" y="44" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="213.5" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.60, 0.40</text>

    <rect x="71" y="118" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="118.5" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.40, 0.60</text>

    <rect x="166" y="118" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="213.5" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.32, 0.08</text>

    <!-- caption -->
    <text x="150" y="214" text-anchor="middle" font-size="11" fill="#475569">Low-Price beats Upscale in every</text>
    <text x="150" y="229" text-anchor="middle" font-size="11" fill="#475569">column for Firm 1 (0.48&gt;0.40, 0.60&gt;0.32)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="295" y1="148" x2="360" y2="148" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="297" y="158" width="63" height="30" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="328.5" y="170" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400E">UNCONDITIONAL</text>
  <text x="328.5" y="182" text-anchor="middle" font-size="8.5" fill="#92400E">domination</text>

  <!-- ======================= STAGE 2: AFTER REMOVING FIRM1 UPSCALE ROW (panel origin x=365) ======================= -->
  <g transform="translate(365, 56)">
    <text x="150" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Stage 2 &#8212; Remove Firm 1: Upscale</text>

    <text x="165" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400E">Firm 2</text>
    <text x="118" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Low-Price</text>
    <text x="213" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Upscale</text>
    <text x="60" y="80" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Low-Price</text>
    <text x="60" y="154" text-anchor="end" font-size="11.5" font-weight="600" fill="#94A3B8">Upscale</text>

    <!-- surviving row 1 -->
    <rect x="71" y="44" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="118.5" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.48, 0.12</text>

    <rect x="166" y="44" width="95" height="74" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="213.5" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">0.60, 0.40</text>

    <!-- removed row 2: dashed, crossed out -->
    <rect x="71" y="118" width="95" height="74" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="118.5" y="162" text-anchor="middle" font-size="14" fill="#94A3B8">0.40, 0.60</text>
    <line x1="75" y1="122" x2="162" y2="188" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="162" y1="122" x2="75" y2="188" stroke="#CBD5E1" stroke-width="1.5"/>

    <rect x="166" y="118" width="95" height="74" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="213.5" y="162" text-anchor="middle" font-size="14" fill="#94A3B8">0.32, 0.08</text>
    <line x1="170" y1="122" x2="257" y2="188" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="257" y1="122" x2="170" y2="188" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- caption -->
    <text x="150" y="214" text-anchor="middle" font-size="11" fill="#475569">Firm 1 always plays Low-Price, so</text>
    <text x="150" y="229" text-anchor="middle" font-size="11" fill="#475569">Upscale is gone for any Firm 2 choice</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="645" y1="148" x2="710" y2="148" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="647" y="158" width="63" height="30" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="678.5" y="170" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5B21B6">CONDITIONAL</text>
  <text x="678.5" y="182" text-anchor="middle" font-size="8.5" fill="#5B21B6">elimination</text>

  <!-- ======================= STAGE 3: AFTER REMOVING FIRM2 LOW-PRICE COLUMN (panel origin x=715) ======================= -->
  <g transform="translate(715, 56)">
    <text x="150" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Stage 3 &#8212; Remove Firm 2: Low-Price</text>

    <text x="165" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400E">Firm 2</text>
    <text x="118" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#94A3B8">Low-Price</text>
    <text x="213" y="38" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Upscale</text>
    <text x="60" y="80" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Low-Price</text>

    <!-- removed column: dashed, crossed out -->
    <rect x="71" y="44" width="95" height="74" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="118.5" y="88" text-anchor="middle" font-size="14" fill="#94A3B8">0.48, 0.12</text>
    <line x1="75" y1="48" x2="162" y2="114" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="162" y1="48" x2="75" y2="114" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- surviving / equilibrium cell -->
    <rect x="166" y="44" width="95" height="74" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
    <text x="213.5" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">0.60, 0.40</text>

    <!-- ghost row already removed in stage 2 -->
    <rect x="71" y="118" width="190" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="166" y="158" text-anchor="middle" font-size="10" fill="#CBD5E1">Upscale row already</text>
    <text x="166" y="172" text-anchor="middle" font-size="10" fill="#CBD5E1">removed in Stage 2</text>

    <!-- caption -->
    <text x="150" y="214" text-anchor="middle" font-size="11" fill="#475569">Given Firm 1 = Low-Price, Firm 2's</text>
    <text x="150" y="229" text-anchor="middle" font-size="11" fill="#475569">best reply is Upscale (0.40&gt;0.12)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 320)">
    <rect x="0" y="-10" width="16" height="14" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="22" y="1" font-size="10.5" fill="#475569">Unconditional domination: worse in every column, for any opponent strategy</text>
  </g>
  <g transform="translate(40, 342)">
    <rect x="0" y="-10" width="16" height="14" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="22" y="1" font-size="10.5" fill="#475569">Conditional elimination: worse only after the first round reduces the game</text>
  </g>
</svg>
