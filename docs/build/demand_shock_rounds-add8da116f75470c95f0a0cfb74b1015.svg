<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="12" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">A Demand Shock Travels Upstream in Rounds</text>
  <text x="480" y="55" text-anchor="middle" font-size="10" fill="#64748B">Blue arrows show goods flowing from supplier to buyer; purple highlights show the output response.</text>

  <g transform="translate(18,76)">
    <rect width="292" height="266" rx="12" fill="#F8FAFC" stroke="#94A3B8" filter="url(#shadow)"/>
    <rect width="292" height="38" rx="12" fill="#7C3AED"/>
    <rect y="26" width="292" height="12" fill="#7C3AED"/>
    <text x="146" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">0. Initial demand shock: Δd</text>
    <line x1="65" y1="120" x2="126" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="120" x2="224" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="205" x2="229" y2="145" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <circle cx="48" cy="120" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="146" cy="120" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="244" cy="120" r="30" fill="#EDE9FE" stroke="#7C3AED" stroke-width="4"/>
    <circle cx="146" cy="212" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="48" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">1</text>
    <text x="146" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">2</text>
    <text x="244" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">3</text>
    <text x="146" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">4</text>
    <rect x="184" y="166" width="100" height="24" rx="12" fill="#EDE9FE"/>
    <text x="234" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">demand rises</text>
    <text x="146" y="249" text-anchor="middle" font-size="10" fill="#475569">Sector 3 expands first.</text>
  </g>

  <g transform="translate(334,76)">
    <rect width="292" height="266" rx="12" fill="#F8FAFC" stroke="#94A3B8" filter="url(#shadow)"/>
    <rect width="292" height="38" rx="12" fill="#3B82F6"/>
    <rect y="26" width="292" height="12" fill="#3B82F6"/>
    <text x="146" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1. First backward linkage: AΔd</text>
    <line x1="65" y1="120" x2="126" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="120" x2="224" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="205" x2="229" y2="145" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <circle cx="48" cy="120" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="146" cy="120" r="30" fill="#EDE9FE" stroke="#7C3AED" stroke-width="4"/>
    <circle cx="244" cy="120" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="146" cy="212" r="30" fill="#EDE9FE" stroke="#7C3AED" stroke-width="4"/>
    <text x="48" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">1</text>
    <text x="146" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">2</text>
    <text x="244" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
    <text x="146" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">4</text>
    <path d="M225,91 C205,62 164,62 150,86" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
    <path d="M232,150 C217,190 178,210 174,210" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
    <text x="146" y="249" text-anchor="middle" font-size="10" fill="#475569">Its direct suppliers expand next.</text>
  </g>

  <g transform="translate(650,76)">
    <rect width="292" height="266" rx="12" fill="#F8FAFC" stroke="#94A3B8" filter="url(#shadow)"/>
    <rect width="292" height="38" rx="12" fill="#3B82F6"/>
    <rect y="26" width="292" height="12" fill="#3B82F6"/>
    <text x="146" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2+. Indirect rounds: A²Δd + ···</text>
    <line x1="65" y1="120" x2="126" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="120" x2="224" y2="120" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="164" y1="205" x2="229" y2="145" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <circle cx="48" cy="120" r="30" fill="#EDE9FE" stroke="#7C3AED" stroke-width="4"/>
    <circle cx="146" cy="120" r="25" fill="#EDE9FE" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="244" cy="120" r="23" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="146" cy="212" r="25" fill="#EDE9FE" stroke="#A78BFA" stroke-width="3"/>
    <text x="48" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">1</text>
    <text x="146" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">2</text>
    <text x="244" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
    <text x="146" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">4</text>
    <path d="M119,91 C96,69 65,75 57,87" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
    <text x="146" y="249" text-anchor="middle" font-size="10" fill="#475569">Suppliers of suppliers respond.</text>
  </g>

  <g transform="translate(74,370)">
    <rect width="812" height="118" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="406" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">The Leontief inverse adds every round</text>
    <text x="406" y="57" text-anchor="middle" font-size="19" font-weight="700" fill="#1E293B">Δx = (I − A)⁻¹Δd = Δd + AΔd + A²Δd + ···</text>
    <rect x="126" y="72" width="560" height="30" rx="15" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="406" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">lᵢⱼ = total response of sector i to one unit of final demand for good j</text>
  </g>
</svg>
