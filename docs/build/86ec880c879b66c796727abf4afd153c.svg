<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Work backward through the advertising game</title><desc id="desc">First compare Firm 2 payoffs at both decision nodes: B after A gives 6 rather than 4; A after B gives 12 rather than 2. Firm 1 then chooses A for 12 rather than B for 6. Play goes forward from Firm 1 to Firm 2.</desc>
<defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker></defs>
<rect width="960" height="510" rx="12" fill="#FFFFFF"/>
<text x="480" y="32" text-anchor="middle" font-size="20" fill="#1E293B" font-weight="700">Work Backward Through the Advertising Game</text>
<text x="480" y="54" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">Payoffs: (Firm 1, Firm 2)  •  Solid amber = chosen action; dashed gray = rejected action</text>
<rect x="16" y="72" width="456" height="370" rx="12" fill="#FFFBEB" stroke="#FEF3C7" filter="url(#shadow)"/>
<rect x="488" y="72" width="456" height="370" rx="12" fill="#FFFBEB" stroke="#FEF3C7" filter="url(#shadow)"/>
<text x="244" y="100" text-anchor="middle" font-size="15" fill="#92400E" font-weight="600">1. What would Firm 2 do at each node?</text>
<circle cx="244" cy="143" r="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="244" y="147" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="600">1</text>
<circle cx="134" cy="230" r="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="134" y="234" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="600">2</text>
<circle cx="354" cy="230" r="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="354" y="234" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="600">2</text>
<line x1="233" y1="153" x2="144" y2="219" stroke="#94A3B8" stroke-width="2.5"/>
<line x1="255" y1="153" x2="344" y2="219" stroke="#94A3B8" stroke-width="2.5"/>
<text x="175" y="179" text-anchor="middle" font-size="12" fill="#1E293B" font-weight="600">A</text>
<text x="313" y="179" text-anchor="middle" font-size="12" fill="#1E293B" font-weight="600">B</text>
<line x1="134" y1="243" x2="64" y2="306" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="99.0" y="272" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">A</text>
<line x1="134" y1="243" x2="204" y2="306" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="169.0" y="272" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">B</text>
<line x1="354" y1="243" x2="284" y2="306" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="319.0" y="272" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">A</text>
<line x1="354" y1="243" x2="424" y2="306" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="389.0" y="272" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">B</text>
<text x="64" y="330" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">(8, 4)</text>
<text x="204" y="330" text-anchor="middle" font-size="14" fill="#92400E" font-weight="700">(12, 6)</text>
<text x="284" y="330" text-anchor="middle" font-size="14" fill="#92400E" font-weight="700">(6, 12)</text>
<text x="424" y="330" text-anchor="middle" font-size="14" fill="#475569" font-weight="400">(4, 2)</text>
<text x="134" y="365" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">After A: choose B (6 &gt; 4)</text>
<text x="354" y="389" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">After B: choose A (12 &gt; 2)</text>
<text x="244" y="422" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">Check both nodes, even if one is never reached.</text>
<text x="716" y="100" text-anchor="middle" font-size="15" fill="#92400E" font-weight="600">2. What should Firm 1 choose?</text>
<circle cx="716" cy="143" r="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="716" y="147" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="600">1</text>
<line x1="705" y1="153" x2="606" y2="265" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="727" y1="153" x2="826" y2="265" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="630" y="191" text-anchor="middle" font-size="13" fill="#92400E" font-weight="600">A</text>
<text x="802" y="191" text-anchor="middle" font-size="13" fill="#475569" font-weight="600">B</text>
<rect x="522" y="280" width="172" height="70" rx="12" fill="#FEF3C7" stroke="#F59E0B" filter="url(#shadow)"/>
<rect x="738" y="280" width="172" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<text x="608" y="305" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">Firm 2 chooses B</text>
<text x="608" y="331" text-anchor="middle" font-size="16" fill="#92400E" font-weight="700">(12, 6)</text>
<text x="824" y="305" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">Firm 2 chooses A</text>
<text x="824" y="331" text-anchor="middle" font-size="16" fill="#1E293B" font-weight="600">(6, 12)</text>
<text x="716" y="386" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">Firm 1 compares its own payoffs: 12 &gt; 6.</text>
<text x="716" y="422" text-anchor="middle" font-size="11" fill="#475569" font-weight="400">Play: Firm 1 chooses A, then Firm 2 chooses B.</text>
<text x="480" y="475" text-anchor="middle" font-size="12" fill="#1E293B" font-weight="600">We reason backward from Firm 2’s choices, then play forward from Firm 1’s choice.</text>
</svg>
