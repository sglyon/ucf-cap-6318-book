<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title description" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Same friendships, different characteristic</title>
  <desc id="description">The same six-node friendship cycle is shown twice. Soccer participation divides A B C from D E F, giving two cross-type friendships. Chess participation divides A C E from B D F, giving six cross-type friendships. Both characteristics occur in three of six people.</desc>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="550" rx="12" fill="#FFFFFF" stroke="none"/>
  <text x="450.0" y="35" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">Same friendships, different characteristic</text>
  <text x="450" y="61" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">Keep all six friendships fixed. Change only the characteristic attached to each node.</text>
  <g filter="url(#shadow)">
    <rect x="25" y="85" width="410" height="425" rx="12" fill="#EFF6FF" stroke="none"/>
  </g>
  <text x="230" y="115" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">X = plays soccer</text>
  <line x1="130" y1="195" x2="230" y2="152" stroke="#94A3B8" stroke-width="2"/>
  <line x1="230" y1="152" x2="330" y2="195" stroke="#94A3B8" stroke-width="2"/>
  <line x1="330" y1="195" x2="330" y2="300" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="330" y1="300" x2="230" y2="343" stroke="#94A3B8" stroke-width="2"/>
  <line x1="230" y1="343" x2="130" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <line x1="130" y1="300" x2="130" y2="195" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="130" cy="195" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="199" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">A</text>
  <circle cx="230" cy="152" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="230" y="156" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">B</text>
  <circle cx="330" cy="195" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="330" y="199" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">C</text>
  <circle cx="330" cy="300" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="330" y="304" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">D</text>
  <circle cx="230" cy="343" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="230" y="347" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">E</text>
  <circle cx="130" cy="300" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="130" y="304" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">F</text>
  <rect x="45" y="375" width="370" height="65" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="56" y="398" font-size="11" fill="#1E293B" text-anchor="start" font-weight="600">Node</text>
  <text x="56" y="424" font-size="11" fill="#1E293B" text-anchor="start" font-weight="600">Has X?</text>
  <text x="136" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">A</text>
  <text x="136" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="181" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">B</text>
  <text x="181" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="226" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">C</text>
  <text x="226" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="271" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">D</text>
  <text x="271" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="316" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">E</text>
  <text x="316" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="361" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">F</text>
  <text x="361" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="230" y="480" font-size="14" fill="#5B21B6" text-anchor="middle" font-weight="600">2 of 6 friendships cross the two types</text>
  <g filter="url(#shadow)">
    <rect x="465" y="85" width="410" height="425" rx="12" fill="#EFF6FF" stroke="none"/>
  </g>
  <text x="670" y="115" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">X = plays chess</text>
  <line x1="570" y1="195" x2="670" y2="152" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="670" y1="152" x2="770" y2="195" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="770" y1="195" x2="770" y2="300" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="770" y1="300" x2="670" y2="343" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="670" y1="343" x2="570" y2="300" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="570" y1="300" x2="570" y2="195" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="570" cy="195" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="570" y="199" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">A</text>
  <circle cx="670" cy="152" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="670" y="156" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">B</text>
  <circle cx="770" cy="195" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="770" y="199" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">C</text>
  <circle cx="770" cy="300" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="770" y="304" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">D</text>
  <circle cx="670" cy="343" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="670" y="347" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">E</text>
  <circle cx="570" cy="300" r="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="570" y="304" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">F</text>
  <rect x="485" y="375" width="370" height="65" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="496" y="398" font-size="11" fill="#1E293B" text-anchor="start" font-weight="600">Node</text>
  <text x="496" y="424" font-size="11" fill="#1E293B" text-anchor="start" font-weight="600">Has X?</text>
  <text x="576" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">A</text>
  <text x="576" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="621" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">B</text>
  <text x="621" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="666" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">C</text>
  <text x="666" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="711" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">D</text>
  <text x="711" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="756" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">E</text>
  <text x="756" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">yes</text>
  <text x="801" y="398" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="600">F</text>
  <text x="801" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">no</text>
  <text x="670" y="480" font-size="14" fill="#5B21B6" text-anchor="middle" font-weight="600">6 of 6 friendships cross the two types</text>
  <circle cx="47" cy="534" r="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="47" y="538" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">X</text>
  <text x="64" y="538" font-size="11" fill="#475569" text-anchor="start" font-weight="400">has characteristic</text>
  <circle cx="220" cy="534" r="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="220" y="538" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="600">–</text>
  <text x="237" y="538" font-size="11" fill="#475569" text-anchor="start" font-weight="400">does not have characteristic</text>
  <line x1="445" y1="534" x2="478" y2="534" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="488" y="538" font-size="11" fill="#475569" text-anchor="start" font-weight="400">cross-type friendship</text>
  <text x="860" y="538" font-size="11" fill="#475569" text-anchor="end" font-weight="400">3 of 6 have X in each panel</text>
</svg>
