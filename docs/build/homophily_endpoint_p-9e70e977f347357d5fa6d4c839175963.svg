<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title description" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Two ways to get a cross-characteristic pair</title>
  <desc id="description">Independent endpoint draws give four ordered outcomes. X then not X and not X then X each have probability p_x times (1 minus p_x). Their sum is 2 p_x (1 minus p_x).</desc>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="12" fill="#FFFFFF" stroke="none"/>
  <text x="450.0" y="35" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">Two ways to get a cross-characteristic pair</text>
  <text x="450" y="61" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">Draw the two endpoint types independently; pₓ is the share with characteristic X.</text>
  <text x="455" y="97" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="600">Second endpoint</text>
  <text x="365" y="124" font-size="12" fill="#1E40AF" text-anchor="middle" font-weight="600">X  (probability pₓ)</text>
  <text x="665" y="124" font-size="12" fill="#92400E" text-anchor="middle" font-weight="600">not X  (probability 1 − pₓ)</text>
  <text x="32" y="194" font-size="12" fill="#1E293B" text-anchor="start" font-weight="600">First:</text>
  <text x="32" y="218" font-size="14" fill="#1E40AF" text-anchor="start" font-weight="600">X</text>
  <text x="32" y="240" font-size="11" fill="#475569" text-anchor="start" font-weight="400">probability pₓ</text>
  <text x="32" y="322" font-size="12" fill="#1E293B" text-anchor="start" font-weight="600">First:</text>
  <text x="32" y="346" font-size="14" fill="#92400E" text-anchor="start" font-weight="600">not X</text>
  <text x="32" y="368" font-size="11" fill="#475569" text-anchor="start" font-weight="400">probability 1 − pₓ</text>
  <g filter="url(#shadow)">
    <rect x="200" y="141" width="290" height="112" rx="12" fill="#EFF6FF" stroke="none"/>
  </g>
  <text x="345" y="171" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">X → X</text>
  <text x="345" y="202" font-size="18" fill="#1E40AF" text-anchor="middle" font-weight="600">pₓ²</text>
  <text x="345" y="230" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">same-characteristic pair</text>
  <g filter="url(#shadow)">
    <rect x="510" y="141" width="290" height="112" rx="12" fill="#EDE9FE" stroke="none"/>
  </g>
  <text x="655" y="171" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">X → not X</text>
  <text x="655" y="202" font-size="18" fill="#5B21B6" text-anchor="middle" font-weight="600">pₓ(1 − pₓ)</text>
  <text x="655" y="230" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">cross-characteristic pair</text>
  <g filter="url(#shadow)">
    <rect x="200" y="269" width="290" height="112" rx="12" fill="#EDE9FE" stroke="none"/>
  </g>
  <text x="345" y="299" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">not X → X</text>
  <text x="345" y="330" font-size="18" fill="#5B21B6" text-anchor="middle" font-weight="600">(1 − pₓ)pₓ</text>
  <text x="345" y="358" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">cross-characteristic pair</text>
  <g filter="url(#shadow)">
    <rect x="510" y="269" width="290" height="112" rx="12" fill="#EFF6FF" stroke="none"/>
  </g>
  <text x="655" y="299" font-size="15" fill="#1E293B" text-anchor="middle" font-weight="600">not X → not X</text>
  <text x="655" y="330" font-size="18" fill="#1E40AF" text-anchor="middle" font-weight="600">(1 − pₓ)²</text>
  <text x="655" y="358" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">same-characteristic pair</text>
  <rect x="170" y="402" width="660" height="45" rx="12" fill="#EDE9FE" stroke="none"/>
  <text x="500" y="430" font-size="15" fill="#5B21B6" text-anchor="middle" font-weight="600">Cross-type probability: pₓ(1 − pₓ) + (1 − pₓ)pₓ = 2pₓ(1 − pₓ)</text>
  <text x="450" y="474" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">Equal shares: pₓ = 1/2 → 0.50     |     Unequal shares: pₓ = 1/5 → 0.32</text>
  <text x="450" y="500" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">Arrows indicate the order of the draws, not directed friendships.</text>
</svg>
