    <line x1="223" y1="143" x2="237" y2="157" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="237" y1="143" x2="223" y2="157" stroke="#DC2626" stroke-width="2.5"/>

    <circle cx="70" cy="80" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">d₁</text>
    <text x="70" y="104" text-anchor="middle" font-size="7.5" fill="#1E40AF">h₁&#8827;h₂&#8827;h₃</text>

    <circle cx="70" cy="150" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">d₂</text>
    <text x="70" y="174" text-anchor="middle" font-size="7.5" fill="#1E40AF">h₁&#8827;h₂&#8827;h₃</text>

    <circle cx="70" cy="220" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">d₃</text>
    <text x="70" y="244" text-anchor="middle" font-size="7.5" fill="#1E40AF">h₂&#8827;h₁&#8827;h₃</text>

    <circle cx="390" cy="80" r="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="390" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">h₁</text>
    <text x="390" y="104" text-anchor="middle" font-size="7.5" fill="#92400E">d₂&#8827;d₁&#8827;d₃</text>

    <circle cx="390" cy="150" r="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="390" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">h₂</text>
    <text x="390" y="174" text-anchor="middle" font-size="7.5" fill="#92400E">d₁&#8827;d₃&#8827;d₂</text>

    <circle cx="390" cy="220" r="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="390" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">h₃</text>
    <text x="390" y="244" text-anchor="middle" font-size="7.5" fill="#92400E">d₃&#8827;d₂&#8827;d₁</text>

    <text x="230" y="265" text-anchor="middle" font-size="9.5" fill="#1E293B">Rejected d₃ tries h₁: h₁ prefers its held d₂, rejects d₃ again.</text>
  </g>

